# ─── FORMULAS ────────────────────────────────────────────────────────────────

formulas:
  - name: to_ticks
    status: active
    source: design/gdd/enemy-wave.md
    referenced_by:
      - design/gdd/enemy-wave.md
      - design/gdd/game-state-stage-flow.md
      - design/gdd/combat-damage.md
      - design/gdd/hero-system.md
      - design/gdd/tower-system.md
    variables:
      - seconds
      - dt
    output_range: [0, 36000000]
    expression: "round(seconds / dt), halves away from zero"
    notes: "The one conversion for authored time (Flow Rule 4). 1.8 s gives 108 ticks and 0.6 s gives 36 at dt 1/60."
    added: 2026-11-03
    revised: ""
  - name: gold_upper_bound
    status: active
    source: design/gdd/enemy-wave.md
    referenced_by:
      - design/gdd/enemy-wave.md
      - design/gdd/tower-system.md
    variables:
      - starting_gold
      - bounty
      - count
    output_range: [120, 630]
    expression: "starting_gold + sum(bounty * count) over waves 1 to w"
    notes: "Starter values: 456 through wave 5, 630 through wave 6. Tower builds gold_before_wave on it."
    added: 2026-11-03
    revised: ""
  - name: gold_before_wave
    status: active
    source: design/gdd/tower-system.md
    referenced_by:
      - design/gdd/tower-system.md
      - design/gdd/enemy-wave.md
    variables:
      - gold_upper_bound
      - early_call_bonus
      - intermission_duration
    output_range: [120, 496]
    expression: "gold_upper_bound(w - 1) + sum(early_call_bonus(intermission_duration(i))) over waves before w"
    notes: "Starter: 160, 216, 296, 368, 496 before waves 2 to 6; max_final_gold 670. Must stay below the cheapest full board, 550."
    added: 2026-11-03
    revised: ""
  - name: early_call_bonus
    status: active
    source: design/gdd/tower-system.md
    referenced_by:
      - design/gdd/tower-system.md
      - design/gdd/game-state-stage-flow.md
      - design/gdd/battle-hud.md
      - design/gdd/hero-system.md
    variables:
      - seconds_left
      - early_call_seconds_per_gold
    output_range: [0, 8]
    expression: "to_ticks(seconds_left) div to_ticks(early_call_seconds_per_gold)"
    notes: "0 to 8 per call and 40 per stage at starter values. Battle HUD shows it on Call."
    added: 2026-11-03
    revised: ""
  - name: burst_spike
    status: active
    source: design/gdd/tower-system.md
    referenced_by:
      - design/gdd/tower-system.md
      - design/gdd/hero-system.md
      - design/gdd/combat-damage.md
    variables:
      - D_b
      - R
      - d
      - r
      - n
      - s
    output_range: [2, 1000000]
    expression: "(D_b * V_b) / (d * V_s)"
    notes: "Gate: at least 2 for every splash level on every group of 5 or more. Starter lowest 5.78."
    added: 2026-11-03
    revised: ""
  - name: display_seconds
    status: active
    source: design/gdd/battle-hud.md
    referenced_by:
      - design/gdd/battle-hud.md
      - design/gdd/hero-system.md
    variables:
      - cooldown_left
      - dt
    output_range: [0, 600]
    expression: "see Battle HUD Formulas"
    notes: "Hero cooldown_digit() shows display_seconds of cooldown_left."
    added: 2026-11-03
    revised: ""
  - name: hero_share
    status: active
    source: design/gdd/combat-damage.md
    referenced_by:
      - design/gdd/combat-damage.md
      - design/gdd/hero-system.md
      - design/gdd/tower-system.md
    variables:
      - dealt_hero
      - dealt_burst
      - dealt_total
    output_range: [0, 1]
    expression: "(dealt_hero + dealt_burst) / dealt_total, and 0 when dealt_total is 0"
    notes: "Real damage only, so overkill cannot inflate it. Hero gates its median at the greedy bot (hero_share_band)."
    added: 2026-11-03
    revised: ""


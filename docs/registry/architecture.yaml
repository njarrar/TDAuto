#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_singleton
    status: active
    description: "project.godot must have no [autoload] section; no global holds catalogue or game state"
    why: "Hidden globals break headless tests and leak state across retries"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    notes: "ADR-0001 Accepted 2026-11-04; binding"
  - pattern: capturing_lambda_or_bind_in_wiring
    status: active
    description: "The Builder and wrapper must inject method Callables only; no lambda and no bind() with a sim object argument"
    why: "Captures are strong references and can keep an old battle alive after retry"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    notes: "ADR-0001 Accepted 2026-11-04; binding"
  - pattern: sim_back_reference
    status: active
    description: "No sim object holds a reference to Battle, AppRoot or any Node; every object behind an injected Callable is a member of Battle or AppRoot"
    why: "A back-reference forms a cycle so the retry weakref check fails"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    notes: "ADR-0001 Accepted 2026-11-04; binding"
  - pattern: assert_for_release_checks
    status: active
    description: "assert must never guard a release-relevant check; use the injected fatal handler or dev-error sink"
    why: "Exported builds strip assert"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    notes: "ADR-0001 Accepted 2026-11-04; binding"
  - pattern: runtime_directory_scan
    status: active
    description: "No runtime code under src/ uses DirAccess; the catalogue reads only the files manifest.json lists"
    why: "Exports rename and pack files; a scan finds different files on device"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    notes: "ADR-0002 Accepted 2026-11-04; binding"
  - pattern: catalogue_record_write
    status: active
    description: "No code outside src/foundation/data/ assigns a record field or mutates a record list"
    why: "Definitions are shared by every battle and retry; mutable state lives on runtime instances holding def_id"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    notes: "ADR-0002 Accepted 2026-11-04; binding"
  - pattern: catalogue_holds_battle_reference
    status: active
    description: "The Catalogue holds no FatalLatch, handler, battle or node; each battle gets its own StatAccessor"
    why: "The Catalogue outlives every battle, so a battle reference would leak across retries"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    notes: "ADR-0002 Accepted 2026-11-04; binding"
  - pattern: pointer_input_outside_adapter
    status: active
    description: "No gameplay or HUD node other than InputAdapter reads pointer events in _input or _unhandled_input; modal screens use TapScreen._gui_input only"
    why: "A second reader breaks the exactly-once press contract and the routing order"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    notes: "ADR-0003 Accepted 2026-11-04; binding"
  - pattern: input_capturing_wrapper_control
    status: active
    description: "Every non-interactive Control in the BattleWrapper has mouse_filter IGNORE, set on each node and linted; only TapScreen is STOP; the wrapper root is never a full-rect Control"
    why: "A STOP or PASS Control over the field swallows presses before the adapter's _unhandled_input"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    notes: "ADR-0003 Accepted 2026-11-04; binding"
  - pattern: engine_time_in_gameplay
    status: active
    description: "Gameplay code under src/foundation, src/core and src/feature never implements _process or _physics_process, creates a Timer, uses await, reads Engine, Time or OS, or calls Input.flush_buffered_events, Input.parse_input_event or Viewport.push_input; only BattleWrapper reads delta"
    why: "Sim time enters only through Battle.tick, so a battle is a function of its inputs"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    added: 2026-11-04
    notes: "ADR-0004 Accepted 2026-11-04; binding"
  - pattern: global_random_in_sim
    status: active
    # was: scoped to src/foundation, src/core, src/feature only (TD-ADR finding 2)
    description: "No global random function, Array.shuffle(), Array.pick_random() or RandomNumberGenerator.new() anywhere in src/ except the Builder and the wrapper; rng.randfn() banned in sim folders"
    why: "Global draws are not tied to rng_seed and break replay"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    added: 2026-11-04
    notes: "ADR-0004 Accepted 2026-11-04; binding"
  - pattern: vector_methods_in_sim
    status: active
    description: "In src/foundation, src/core and src/feature, sim maths uses float and int scalars with + - * / sqrt min max abs floor ceil round floori roundi int() clampf clampi is_finite is_nan only; Vector2 is storage (constructor, .x, .y); no Vector2 operators or methods, Rect2 methods, PackedVector2Array maths, Curve2D or Path2D sampling, or transcendentals"
    why: "Engine C++ methods and libm may differ by CPU; determinism is promised per architecture only"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    added: 2026-11-04
    notes: "ADR-0004 Accepted 2026-11-04; binding"
  - pattern: float_countdown
    status: active
    description: "No code subtracts dt from a float countdown; every countdown is an int of ticks and every authored duration passes through TickMath.to_ticks"
    why: "Repeated float subtraction drifts (5.0 s took 301 ticks)"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    added: 2026-11-04
    notes: "ADR-0004 Accepted 2026-11-04; binding"
  - pattern: stat_value_cache
    status: active
    description: "No caller stores a stat read past the action that read it; the only exception is max_hp read once at spawn to seed Health"
    why: "A Vertical Slice modifier must reach live entities with no call-site change (TR-data-008)"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
    notes: "ADR-0005 Accepted 2026-11-04; binding"
  - pattern: stat_key_literal
    status: active
    description: "No String or &-literal key argument to stat_int or stat_float; keys come only from StatKeys constants (lint L-STAT-1)"
    # was: "A literal skips the vocabulary and a String converts to StringName on every call" (before 2026-11-04 engine probes)
    why: "A literal skips the vocabulary and loses typo safety; cost is not a reason (a literal costs the same as a constant)"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
    revised: "2026-11-04"
    notes: "ADR-0005 Accepted 2026-11-04; binding"
  - pattern: read_context_per_read
    status: active
    description: "No read path calls ReadContext.new(); each owner makes its contexts once and reuses them; a context holds its live entity only by WeakRef and never a Node"
    why: "Per-read contexts allocate in the hot path; a strong live entity forms a RefCounted cycle with the Enemy that owns the context"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
    notes: "ADR-0005 Accepted 2026-11-04; binding"
  - pattern: deferred_or_one_shot_connection
    status: active
    # was: no REFERENCE_COUNTED, add_user_signal or tween_await (before godot-specialist and TD-ADR review)
    description: "No CONNECT_DEFERRED, CONNECT_ONE_SHOT or CONNECT_REFERENCE_COUNTED, no add_user_signal, emit_signal or string connect, no deferred emit, no await or tween_await on a battle signal in src/; every connection goes through Wiring.connect_recorded() with flags 0"
    why: "Deferred calls land after _process when the tick has moved on; one-shot drops a connection behind the Wiring record"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    added: 2026-11-04
    notes: "ADR-0006 Accepted 2026-11-04; binding"
  - pattern: view_listener_steers
    status: active
    # was: any mutating method, no resolver registry carve-out (before godot-specialist and TD-ADR review)
    description: "A handler of a WIRING or VIEW battle signal never calls a command, a mutating method or field write on a sim member (flow, combat, enemy_wave, tower_sim, hero_sim, fatal_latch, stat_accessor, halt_gate) or the stat accessor, and never keeps a payload object or query list; input owners may call resolver register/unregister/set_enabled/set_centre, never cancel(); the Builder never connects a sim to a VIEW or INPUT signal"
    why: "Views must not change a result; a battle with every view removed must match"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    added: 2026-11-04
    notes: "ADR-0006 Accepted 2026-11-04; binding"
  - pattern: signal_assert_or_generated_double_in_tests
    status: active
    description: "Tests never use gdUnit4 assert_signal, monitor_signals, mock() or spy(); signals are recorded by hand-written fakes into one EventLog that checks count, typeof() and class per argument (lint L-TEST-1)"
    why: "assert_signal awaits and is timing-dependent (TR-input-014); generated doubles do not check payload types"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
    notes: "ADR-0007 Accepted 2026-11-04; binding"
  - pattern: file_or_scene_in_unit_tests
    status: active
    description: "Nothing under tests/unit/ uses FileAccess, DirAccess, load_manifest, a .tscn or .scn path, or get_tree(); catalogues come from code-built fixtures through from_documents or from_texts (lint L-TEST-2)"
    why: "TR-data-012 and TR-enemy-014: logic tests are fast, isolated and deterministic; real files belong to tests/integration/"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
    notes: "ADR-0007 Accepted 2026-11-04; binding"
  - pattern: class_name_in_tests_or_tools
    status: active
    description: "No class_name in tests/ or tools/; helpers load by const preload. Every class_name in src/ must not clash with an engine class or another global script class (lints L-NAME-1, L-NAME-2)"
    why: "Every class_name is global; gdUnit4 already holds names such as Comparator, Fuzzer, LocalTime, ValueProvider"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
    notes: "ADR-0007 Accepted 2026-11-04; binding"
  - pattern: command_from_resolver_cancel_signals
    status: active
    description: "An input owner never issues a command from its drag_cancelled or became_idle handler; it only reverts or clears its own presentation state there"
    # was: why named only the tick and teardown callers (before TD-ADR review)
    why: "Both are cleanup edges; became_idle ends every gesture and can run inside a Flow tick or at AppRoot teardown, where ADR-0006's guard covers the tick but not teardown; no GDD owner needs a command there. Narrows ADR-0006's INPUT role; checked by integration test V12, no lint"
    adr: docs/architecture/adr-0008-input-resolver-core-signal-contract.md
    added: 2026-11-04
    revised: "2026-11-04"
    notes: "ADR-0008 Accepted 2026-11-04; binding"
  - pattern: resolver_gesture_call_outside_adapter
    status: active
    # was: no InputResolver.new() or state() rule; trace ban scoped to owners (before TD-ADR review)
    description: "Only InputAdapter calls press, move, release and cancel_pointer; only the adapter, Flow's cancel_input target and AppRoot teardown call cancel(); no InputResolver.new() outside the resolver file; no last_trace(), GestureTrace or resolver state() outside src/foundation/input/, src/presentation/dev/ and tests (lints L-INPUT-6, L-INPUT-7, ADR-0007 amendment pending)"
    why: "A gesture from anywhere else bypasses the adapter's one-ending-per-press contract; meaning built on the trace would hide outside the signal contract"
    adr: docs/architecture/adr-0008-input-resolver-core-signal-contract.md
    added: 2026-11-04
    revised: "2026-11-04"
    notes: "ADR-0008 Accepted 2026-11-04; binding"
  - pattern: hp_write_outside_combat
    status: active
    description: "No code in src/ outside src/core/combat/ reads or writes .health or .status, or calls Health.new or Status.new; every HP change goes through Combat.deliver (lint L-COMBAT-1, ADR-0007 amendment owed)"
    why: "One HP path keeps the damage counters and hero share honest and invariant I true"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
    notes: "ADR-0009 Accepted 2026-11-04; binding"
  - pattern: targetable_write_outside_enemy_wave
    status: active
    description: "No code in src/ outside src/feature/enemy_wave/ assigns spawn_id, distance, x, y or removed on a Targetable, keeps a roster() or targets() list past its slot, or mutates one; callers get the same instance (lints L-COMBAT-2 and L-COMBAT-4, ADR-0007 amendment owed)"
    why: "EnemyWave is the sole roster owner; a kept list or a second writer breaks spawn_id order and retry freeing"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
    notes: "ADR-0009 Accepted 2026-11-04; binding"
  - pattern: damage_event_per_hit_or_kept
    status: active
    description: "No DamageEvent.new() outside tower_sim.gd and hero_sim.gd (one reused instance each); the caller nulls its target after the attack; no view payload carries a Targetable (lint L-COMBAT-3, ADR-0007 amendment owed)"
    why: "A new event per hit allocates in the tick; a kept target holds an enemy across ticks"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
    notes: "ADR-0009 Accepted 2026-11-04; binding"
  - pattern: command_result_truthiness
    status: active
    description: "No if r:, not r or bare OK against a command result; compare to the qualified enum value, e.g. TowerSim.BuildResult.OK (lint L-CMD-2, ADR-0007 amendment owed)"
    why: "OK is 0 and falsy; bare OK is the global Error.OK, which is 0 by definition, so r == OK parses and is true and the bug is silent (probes T6, R9); the lint covers hud_logic.gd, tower_input.gd, hero_input.gd and tests/helpers/bots/"
    adr: docs/architecture/adr-0010-sim-input-split-command-results-dev-telemetry.md
    added: 2026-11-05
    notes: "ADR-0010 Accepted 2026-11-05; binding"
  - pattern: command_call_outside_owner
    status: active
    description: "Keyed on receivers in src/: tower_sim.build(, flow.start_wave(, flow.call_early( only in hud_logic.gd; tower_sim.upgrade( only in tower_input.gd; hero_sim.pin(, hero_sim.burst( only in hero_input.gd (lint L-CMD-1); no telemetry object (RunMeasures, RunLog, GestureLog, JsonlFileSink) calls a command or writes sim state, and none is built when OS.is_debug_build() is false; no sim-folder file outside src/feature/hero/ and no src/root/ file but battle.gd and battle_builder.gd names hero_sim or HeroSim (lint L-HERO-1); ADR-0007 amendment owed"
    why: "Inputs must act only through their commands so the bot path equals the human path; telemetry must never change a result"
    adr: docs/architecture/adr-0010-sim-input-split-command-results-dev-telemetry.md
    added: 2026-11-05
    notes: "ADR-0010 Accepted 2026-11-05; binding"
  - pattern: shader_or_particles_in_battle_views
    status: active
    description: "No ShaderMaterial, CanvasItemMaterial, Light2D, CanvasModulate, Environment.glow, GPUParticles2D or CPUParticles2D in the field views or battle HUD at MVP; the hit flash is a drawn disc (QQ-10); lint L-VIEW-1, ADR-0007 amendment owed"
    why: "A material breaks batching; a TIME-driven shader runs through Pause and ignores Reduce Motion"
    adr: docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-05
    notes: "ADR-0011 Proposed 2026-11-05; not binding until Accepted"
  - pattern: tween_or_engine_time_in_battle_views
    status: active
    description: "Field views and battle HUD primitives animate only from the wrapper's ViewClock (advanced in frame step 3, frozen while PAUSED) and read Reduce Motion only through MotionPolicy; no Tween, create_tween, SceneTree timer, await or Time call there, the debug RenderBudgetProbe apart (lint L-VIEW-2, ADR-0007 amendment owed)"
    why: "One clock makes pause, retry and Reduce Motion hold in one place"
    adr: docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-05
    notes: "ADR-0011 Proposed 2026-11-05; not binding until Accepted"

# Example:
#
# forbidden_patterns:
#   - pattern: autoload_singleton_coupling
#     status: active
#     description: "Systems must not directly reference Autoload singletons by name.
#       Use dependency injection or signals instead."
#     why: "Tight coupling to Autoloads makes systems untestable in isolation and
#       creates hidden dependencies that break when Autoload load order changes."
#     adr: docs/architecture/adr-0001-health-system.md
#     added: 2026-03-26
#
#   - pattern: direct_cross_system_state_write
#     status: active
#     description: "A system must never write to state owned by another system.
#       Use signals or method calls on the owner instead."
#     why: "Direct state writes create race conditions and break the state
#       ownership model. The owning system must be the sole writer."
#     adr: docs/architecture/adr-0000-architecture-principles.md
#     added: 2026-03-26

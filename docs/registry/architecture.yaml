# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_singleton
    status: active
    description: "No [autoload] section in project.godot and no global singleton. Inject through BattleBuilder or constructors."
    why: "Breaks headless runs and makes retry a hand-written reset"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: sim_back_reference_to_battle
    status: active
    description: "No sim object stores Battle in a field, and no RefCounted cycle exists in battle code."
    why: "GDScript has no cycle collector; a cycle leaks the old battle on retry"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: session_object_holds_battle_callable
    status: "superseded_by: ADR-0005"
    description: "AppRoot, Catalogue, the stat accessor and records never hold a per-battle callable or connect to a per-battle signal; no sim connects to a catalogue signal."
    why: "Either leaks the old battle or sends a later fatal to a dead relay"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: session_object_holds_battle_callable_v2
    status: active
    description: "AppRoot, Catalogue and records never hold a per-battle callable, a ReadContext, or connect to a per-battle signal; no sim connects to a catalogue signal. The StatAccessor is per battle and may hold the battle's fatal."
    why: "Either leaks the old battle or sends a later fatal to a dead relay"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
  - pattern: entity_holds_own_read_context
    status: active
    description: "An entity (enemy, tower, hero) never stores its own ReadContext; the owning system holds contexts keyed by spawn_id or slot and drops them with the entity."
    why: "ReadContext.live_entity points at the entity; both holding each other is a RefCounted cycle that never frees"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
  - pattern: stat_key_literal
    status: active
    description: "Stat keys are always StatKeys constants, never string or StringName literals, at stat_int and stat_float call sites."
    why: "A misspelt constant is a parse error; a misspelt literal is a run-time fatal"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
  - pattern: cached_stat_value
    status: active
    description: "No value read from the StatAccessor is stored for later use, except max_hp seeding Health at spawn."
    why: "Vertical Slice modifiers must take effect with no call-site change (TR-data-008)"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
  - pattern: mutable_static_var
    status: active
    description: "No mutable static var in any class under src/."
    why: "Static state survives a retry and defeats the rebuild"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: in_place_reset
    status: active
    description: "No reset() on battle systems; retry rebuilds the whole battle."
    why: "Hand-listed resets leak state between attempts (prototype, 22 fields)"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: teardown_inside_signal_or_fatal
    status: active
    description: "Never free the wrapper or drop the battle from inside a signal handler or a fatal call; only AppRoot._process tears down."
    why: "The caller would run on freed objects"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: default_for_missing_field
    status: active
    description: "No code supplies a default for a missing catalogue field, in any build."
    why: "A silent default corrupts balance and the hero-share metric (Data & Config Rule 8)"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
  - pattern: record_object_reference
    status: active
    description: "A record stores other records only by StringName ID, never as an object reference or file path (owned sub-data excepted)."
    why: "Keeps records read-only, snapshot-safe and free of cycles"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
  - pattern: method_named_load
    status: active
    description: "No method named load in src/."
    why: "It shadows GDScript's global load() inside its class"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04


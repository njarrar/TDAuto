# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: injected_and_connected_callables
    status: active
    api: "obj.method and emitter.signal_name.connect(listener.method)"
    not: "Callable(obj, name) string form, connect(name, ...) string form, lambdas, bind()"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "Parser-checked wiring; lambdas and bind() can hold strong references and make RefCounted cycles"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
    revised: ""
  - purpose: release_relevant_checks
    status: "superseded_by: ADR-0009"
    api: "injected fatal or dev_error plus push_error"
    not: "assert, print_debug"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "assert and print_debug are stripped from export builds"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - purpose: app_root_scene_loading
    status: active
    api: "ResourceLoader.load() with a null check, then instantiate()"
    not: "preload in app_root.gd"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "A failed preload fails the script that holds the fatal fallback"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - purpose: retry_node_teardown
    status: active
    api: "detach() then remove_child() then queue_free()"
    not: "free() on a node in the current input or signal call"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "The retry request starts inside the wrapper's own signal chain"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - purpose: catalogue_storage_format
    status: active
    api: "JSON files under res://assets/data/ listed in manifest.json, read with FileAccess.get_file_as_string and JSON.parse"
    not: "typed Resources (.tres), ResourceLoader or load() for data files, ConfigFile, directory scans"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    reason: "Missing fields, fractional integers and unknown properties are direct dictionary checks"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
    revised: ""
  - purpose: catalogue_read_only_proof
    status: active
    api: "Catalogue.snapshot(): JSON.stringify of every record's to_dict() with sorted keys and full precision"
    not: "duplicate_deep() or deep == on nested containers"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    reason: "String compare of JSON-native data does not rely on unsourced container equality"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
    revised: ""
  - purpose: release_relevant_checks_v2
    status: active
    api: "injected fatal or dev_error plus push_error; exception: Combat's guard codes (ERR_REMOVED, ERR_BAD_AMOUNT, ERR_BAD_SLOW, ERR_BAD_MAX_HP, ERR_ALREADY_ATTACHED) call push_error directly"
    not: "assert, print_debug"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    reason: "assert and print_debug are stripped from export builds; Combat's guards catch unreachable caller bugs, change nothing, and keep to_ticks its only dependency; bad max_hp is escalated to fatal by EnemyWave"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
    revised: ""
  - purpose: sim_position_representation
    status: active
    api: "float scalar pairs (pos_x, pos_y; origin_x, origin_y; impact_x, impact_y) in all sim state and comparisons, including HeroSim and TowerSim"
    not: "Vector2 for any stored or compared sim position (allowed only for adapter input, command arguments converted on entry, report_attack, view signals, view_position())"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    reason: "Vector2 is expected 32-bit (QQ-05, V1); data is PackedFloat64Array and PinGeometry is scalar"
    referenced_by:
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
    revised: ""
  - purpose: display_stretch
    status: active
    api: "540x960 viewport, display/window/stretch/mode canvas_items, aspect keep, orientation portrait, window mode fullscreen on mobile, all set explicitly in project.godot"
    not: "engine or editor defaults, stretch mode viewport or disabled, aspect expand or keep_width, Camera2D on the battle field"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "Field units equal viewport units on every device; 4.7 changed new-project defaults"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
    revised: ""
  - purpose: input_event_path
    status: active
    api: "InputAdapter: presses in _unhandled_input; moves and releases of forwarded indices in _input, marked handled; every call queued and delivered by flush() at frame step 0; modal screens read InputEventScreenTouch in _gui_input"
    not: "forwarding from the engine callback, _unhandled_input for every event, _input or _unhandled_input outside InputAdapter, polling Input for pointers"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "Controls win presses over them, no Control can strand a forwarded gesture, and a release in the same batch as a focus loss is dropped"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
    revised: ""
  - purpose: pointer_event_family
    status: active
    api: "InputEventScreenTouch and InputEventScreenDrag only, with emulate_touch_from_mouse and emulate_mouse_from_touch both true"
    not: "InputEventMouse* or Button.pressed in battle code, event.device compared to a literal"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "One physical press is one gesture; one adapter code path on desktop and phone; mouse emulation follows touch index 0 only"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
    revised: ""
  - purpose: lifecycle_pause_triggers
    status: active
    api: "NOTIFICATION_APPLICATION_FOCUS_OUT, NOTIFICATION_APPLICATION_PAUSED, NOTIFICATION_WM_WINDOW_FOCUS_OUT, NOTIFICATION_WM_GO_BACK_REQUEST in InputAdapter._notification, with quit_on_go_back false"
    not: "SceneTree.paused, resuming on focus-in or resume notifications"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "One idempotent pause path on desktop and phone; only the Paused screen's tap resumes"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
    revised: ""
  - purpose: safe_area_source
    status: active
    api: "DisplayServer.get_display_safe_area(), window_get_size() and window_get_position(), read in InputAdapter only when OS.has_feature(\"mobile\"), converted to Rect2 and Vector2 and passed to FieldMapping.insets_from_safe_area"
    not: "safe area on desktop, DisplayServer reads in the HUD or views"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "The desktop safe area is the usable screen, not window insets"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
    revised: ""
  - purpose: min_width_guard
    status: active
    api: "FieldMapping.width_supported(floori(field_width_dp(...))) against MIN_FIELD_WIDTH_DP 360, push_error once, play continues"
    not: "a float comparison at the boundary, blocking play"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "Input GDD Formulas floor to integers first so 360 dp does not depend on rounding; the store filter enforces the floor"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
    revised: ""
  - purpose: tick_driver
    status: active
    api: "BattleWrapper._process(delta) with a pure BattleClock accumulator at 60 Hz"
    not: "_physics_process, physics_ticks_per_second, Engine.max_physics_steps_per_frame, Timer, SceneTree.create_timer, await, Engine.time_scale"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    reason: "One function holds the frame order; physics-step interleaving and clamp behaviour are unsourced; the clamp is unit-tested headless"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
    revised: ""
  - purpose: sim_randomness
    status: active
    api: "SimRng (xorshift32, integer only) seeded from rng_seed, held by Battle"
    not: "RandomNumberGenerator, randi, randf, randi_range, randf_range, randomize, seed in sim code"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    reason: "Engine RNG algorithm and cross-platform behaviour are unsourced and could change under the bot baselines"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
    revised: ""
  - purpose: duration_to_ticks
    status: active
    api: "SimTime.to_ticks: sign(x) * floor(abs(x) + 0.5), x = seconds * ticks_per_second, once when a countdown starts"
    not: "round(), ceil() on authored seconds, float countdowns, subtracting dt from a duration"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    reason: "round()'s half rule is unsourced; repeated float subtraction drifts (5.0 s took 301 ticks)"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
    revised: ""


# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: catalogue_load
    status: active
    budget_ms: 1000
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    notes: "Median Loading to Ready over 5 cold launches on one Adreno 5xx-class device (TR-data-015); fallback to a worker if the median exceeds 1000 ms or any launch exceeds 2500 ms; unmeasured until a phone build"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
    revised: ""
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: Mobile
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    added: 2026-11-05
    revised: ""
  - system: input_resolver_commands
    status: active
    budget_ms: 0.5
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    notes: "Unmeasured proposal (QQ-11)"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    added: 2026-11-05
    revised: ""
  - system: simulation_ticks
    status: active
    budget_ms: 4.0
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    notes: "Tick slice. Normal frame one tick; Clock.MAX_TICKS_PER_FRAME 3 (provisional, floor 2); unmeasured; cap set from per-tick cost measured in a release export at the first phone build"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    added: 2026-11-05
    revised: ""
  - system: views_and_hud
    status: active
    budget_ms: 3.0
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    notes: "Unmeasured proposal (QQ-11)"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    added: 2026-11-05
    revised: ""
  - system: combat_targeting
    status: active
    budget_ms: 2.0
    adr: docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    notes: "About 400 range checks per tick (TR-combat-013), unmeasured until a phone build; pass condition MAX_TICKS_PER_FRAME (3) x p99 tick cost <= 4.0 ms inside ADR-0004's simulation slice; Combat.range_checks counter records the real figure"
    referenced_by:

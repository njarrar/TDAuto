# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_singleton
    status: active
    description: "No [autoload] section in project.godot and no global singleton. Inject through BattleBuilder or constructors."
    why: "Breaks headless runs and makes retry a hand-written reset"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
      - docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: sim_back_reference_to_battle
    status: active
    description: "No sim object stores Battle in a field, and no RefCounted cycle exists in battle code."
    why: "GDScript has no cycle collector; a cycle leaks the old battle on retry"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
      - docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: session_object_holds_battle_callable
    status: "superseded_by: ADR-0005"
    description: "AppRoot, Catalogue, the stat accessor and records never hold a per-battle callable or connect to a per-battle signal; no sim connects to a catalogue signal."
    why: "Either leaks the old battle or sends a later fatal to a dead relay"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: session_object_holds_battle_callable_v2
    status: active
    description: "AppRoot, Catalogue and records never hold a per-battle callable, a ReadContext, or connect to a per-battle signal; no sim connects to a catalogue signal. The StatAccessor is per battle and may hold the battle's fatal."
    why: "Either leaks the old battle or sends a later fatal to a dead relay"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
  - pattern: entity_holds_own_read_context
    status: active
    description: "An entity (enemy, tower, hero) never stores its own ReadContext; the owning system holds contexts keyed by spawn_id or slot and drops them with the entity."
    why: "ReadContext.live_entity points at the entity; both holding each other is a RefCounted cycle that never frees"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-read-context-contract.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: stat_key_literal
    status: active
    description: "Stat keys are always StatKeys constants, never string or StringName literals, at stat_int and stat_float call sites."
    why: "A misspelt constant is a parse error; a misspelt literal is a run-time fatal"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
  - pattern: cached_stat_value
    status: active
    description: "No value read from the StatAccessor is stored for later use, except max_hp seeding Health at spawn."
    why: "Vertical Slice modifiers must take effect with no call-site change (TR-data-008)"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-read-context-contract.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
  - pattern: mutable_static_var
    status: active
    description: "No mutable static var in any class under src/."
    why: "Static state survives a retry and defeats the rebuild"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
      - docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: in_place_reset
    # Note (ADR-0004): BattleClock.drop_backlog() is a wrapper clock call, not a sim reset; a lint must not flag it.
    status: active
    description: "No reset() on battle systems; retry rebuilds the whole battle."
    why: "Hand-listed resets leak state between attempts (prototype, 22 fields)"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
      - docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: teardown_inside_signal_or_fatal
    status: active
    description: "Never free the wrapper or drop the battle from inside a signal handler or a fatal call; only AppRoot._process tears down."
    why: "The caller would run on freed objects"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: default_for_missing_field
    status: active
    description: "No code supplies a default for a missing catalogue field, in any build."
    why: "A silent default corrupts balance and the hero-share metric (Data & Config Rule 8)"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
  - pattern: record_object_reference
    status: active
    description: "A record stores other records only by StringName ID, never as an object reference or file path (owned sub-data excepted)."
    why: "Keeps records read-only, snapshot-safe and free of cycles"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: method_named_load
    status: active
    description: "No method named load in src/."
    why: "It shadows GDScript's global load() inside its class"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
  - pattern: core_names_feature_enemy
    status: active
    description: "No code under src/core/ names Enemy or any Feature class; Combat takes and returns Targetable, lists are Array[Targetable] from creation."
    why: "Upward dependency (layer rule 1); typed arrays are invariant"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: combat_piece_back_reference
    status: active
    description: "Health and Status hold no reference to their Targetable or any object; Enemy holds no ReadContext, EnemyWave, Combat, Battle or Callable."
    why: "A back-reference is a RefCounted cycle that never frees"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: hp_change_outside_deliver
    status: active
    description: "No code writes hp, max_hp, strength or ticks_left outside src/core/combat/; every HP change goes through deliver inside a tick."
    why: "Counters and hero share would be bypassed (Combat Rule 2)"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: mutate_roster_view
    status: active
    description: "No caller appends to, erases from, sorts, clears or keeps the arrays returned by roster() or targets(); filtered lists go in the caller's own buffer."
    why: "They are EnemyWave's internal buffers; mutation corrupts the sole-owner roster"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    referenced_by:
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
  - pattern: listener_stores_damage_event
    status: "superseded_by: ADR-0006"   # was: active; replaced by sim_object_in_signal_payload
    description: "No damage_applied listener stores the DamageEvent or reads event.target; views use the copied position and spawn_id."
    why: "Keeps reaped enemies alive and makes views depend on sim objects"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: remove_during_foreach
    status: active
    description: "No element is removed from an array inside a for-in loop over it; removal loops are while i < arr.size() index loops that do not advance i after remove_at(i)."
    why: "Skips the next element and misses children appended by listeners (Enemy & Wave Acceptance 28)"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: engine_input_outside_adapter
    status: active
    description: "No _input or _unhandled_input override, and no Input pointer polling, in src/ outside InputAdapter; modal screens read their own events in _gui_input only."
    why: "Two readers of engine input break one-press-one-gesture and the exactly-one-ending contract"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: tappable_non_modal_control
    status: active
    description: "Every battle Control except the Result and Paused modal screens uses MOUSE_FILTER_IGNORE; game targets are resolver discs, never Controls."
    why: "Control, Panel and ColorRect default to STOP, and PASS also takes a touch press, so any other filter swallows presses meant for discs"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
  - pattern: mouse_event_in_battle_code
    status: active
    description: "No InputEventMouseButton read and no Button.pressed use in battle code; the adapter and modal screens read the touch family."
    why: "Mouse emulation follows touch index 0 only, so a second finger is lost"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: device_id_literal
    status: active
    description: "Never compare InputEvent.device to a number; compare event types, or device to InputEvent.DEVICE_ID_* constants."
    why: "4.7 moved mouse and keyboard off device 0, which some joypads use"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: battle_camera_or_canvas_transform
    status: active
    description: "No Camera2D and no non-identity canvas transform on the battle field."
    why: "Field units must equal viewport units (TR-input-016)"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: scene_tree_pause
    status: active
    description: "Never use get_tree().paused for the lifecycle pause; pause is Flow's PAUSED phase and the in-sim tick gate."
    why: "One pause mechanism; the sim is plain objects ticked by the wrapper"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: canceled_touch_as_release
    status: active
    description: "A touch with canceled true is cancel_pointer, never release, in the adapter and in modal screens."
    why: "An OS cancel treated as a release fires a tap or a drag end: a mis-fire"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: engine_time_in_sim
    # Note (ADR-0008): the development-only GestureLog under src/presentation/dev/ stamps Time.get_ticks_msec(); it is neither sim code nor a real-time model, and the lint must not flag that folder.
    status: active
    # Revised 2026-11-04 (ADR-0007 C4, confirmed by the user). Old description: "No _process, _physics_process, Timer, create_timer, await, Engine.time_scale, Engine.get_frames_drawn, Engine.get_process_frames, Engine.get_physics_frames, Time.* or OS.get_ticks_* in sim code or in real-time models; _process only in BattleWrapper, AppRoot and InputAdapter (SP12 poll); no get_tree().paused; no low_processor_mode; delta_smoothing off."
    description: "No _process, _physics_process, Timer, create_timer, await, Engine.time_scale, Engine.get_frames_drawn, Engine.get_process_frames, Engine.get_physics_frames, Time.* or OS.get_ticks_* anywhere in src/ (ADR-0007 C4; views animate from the frame clock), except AppRoot's seed read, the wrapper's dev timers and src/presentation/dev/ (ADR-0008 GestureLog); _process only in BattleWrapper, AppRoot and InputAdapter (SP12 poll); no get_tree().paused; no low_processor_mode; delta_smoothing off."
    why: "Sim time must enter only through Battle.tick, and the frame order must be one function"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
      - docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
    revised: 2026-11-04
  - pattern: float_duration_countdown
    status: active
    description: "No sim countdown is a float; no code subtracts dt from a duration; every authored duration goes through to_ticks once."
    why: "Float countdowns drift (5.0 s took 301 ticks)"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: command_inside_tick
    status: "superseded_by: ADR-0010"   # was: active; replaced by command_inside_tick_v2
    description: "No command (pin, burst, build, upgrade, start_wave, call_early, pause, resume) runs inside Battle.tick, from a signal listener, or from a real-time model's advance or update."
    why: "Commands apply only between ticks (TR-state-004); displayed must equal paid (TR-hud-005)"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: sim_nondeterministic_math
    status: active
    description: "No floor, ceil, abs, sign (Variant-returning; use floorf/floori, ceilf/ceili, absf/absi), round, sin, cos, tan, atan2, pow, exp, log, fmod, fposmod, lerp, move_toward, snapped or Vector2/Vector3 method on a value that reaches sim state."
    why: "Platform maths libraries may differ; round()'s half rule is unsourced"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: engine_rng_in_sim
    status: active
    description: "No RandomNumberGenerator or global random function in sim code; Presentation randomness never reads rng_seed or sim_rng."
    why: "Same seed and script must give the same result; cosmetic jitter must not touch the sim (TR-enemy-007)"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: hero_input_sync_before_ticks
    status: active
    description: "HeroInput.update() never runs before the frame's ticks; it runs first in frame step 4, so the hit-disc centre and aim_point() match the drawn frame."
    why: "Before the ticks, a press on a walking hero is tested against where it was a frame earlier (TD-ADR T2)"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    referenced_by:
      - docs/architecture/adr-0008-input-resolver-core-signal-contract.md
    added: 2026-11-04
  - pattern: unordered_iteration_in_sim
    status: active
    description: "No sim result or payload depends on Dictionary iteration order, instance IDs or object hashes; iterate arrays in spawn_id or slot order."
    why: "Determinism per architecture (TR-combat-014); Dictionary order is unsourced"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: sim_object_in_signal_payload
    status: active
    description: "No signal payload carries a sim object (Targetable, Enemy, DamageEvent, Health, Status, ReadContext, a record, a system, Battle); payloads are int, float, bool, StringName, Vector2 or an enum."
    why: "A view holding a payload object keeps reaped enemies or the old battle alive and can reach sim state"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    referenced_by:
      - docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
  - pattern: emit_before_commit
    status: active
    description: "No battle signal is emitted before every state change and counter it describes is committed; an emitter checks halted() after every emit."
    why: "Listeners read queries in the handler; a listener can end the battle"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    added: 2026-11-04
  - pattern: connection_outside_builder_or_attach
    status: active
    description: "Battle signals are connected only in BattleBuilder.build (sim to sim) or BattleWrapper.attach (to wrapper nodes, undone in detach); never elsewhere and never inside a handler."
    why: "The listener-count test and the retry teardown rely on two known connection sites"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    added: 2026-11-04
  - pattern: sim_listens_to_view_signal
    status: active
    description: "No sim object connects to a view signal (phase_changed, lives_changed, gold_changed, tower_built, tower_upgraded, hero_pinned, burst_started, attack_fired, damage_applied) or a resolver gesture signal."
    why: "Gameplay must be identical with or without views (TR-tower-012, TR-hud-004)"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    added: 2026-11-04
  - pattern: command_from_sim_or_cancel_listener
    status: active
    description: "Listeners of Flow, EnemyWave, TowerSim, HeroSim and Combat signals, and of drag_cancelled and became_idle, never issue a command, call a tick entry or deliver; only gesture listeners of pressed, tapped, ground_tapped and drag_started/moved/ended issue commands."
    why: "Those signals can fire inside a tick; commands run only between ticks (ADR-0004)"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    added: 2026-11-04
  - pattern: listener_order_dependence
    status: active
    description: "No outcome depends on which of two listeners of one signal runs first; a view needing new state listens to the owner's own signal."
    why: "Call order is unverified on 4.7 (ADR-0006 V4)"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    added: 2026-11-04
  - pattern: data_store_signal
    status: active
    description: "Catalogue, record classes, StatAccessor, ReadContext, entity and value classes, FatalLatch, FatalRelay and Battle declare no signal."
    why: "Each emitter declares its own signals and the composition root wires them (TR-data-014)"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    added: 2026-11-04
  - pattern: combat_signal_listener_reads_accessor
    status: active
    description: "Listeners of attack_fired and damage_applied never call the StatAccessor."
    why: "Combat injects no halted(); its listeners must not be able to reach fatal (ADR-0009 Decision 4)"
    adr: docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
    referenced_by:
      - docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
  - pattern: registry_holds_owner
    status: active
    description: "No InputResolver target row stores an owner, node, Callable or any object; owners hold int ids and drop them, and the resolver, in detach()."
    why: "A reference from the resolver to wrapper nodes is a cycle or a teardown leak (ADR-0001)"
    adr: docs/architecture/adr-0008-input-resolver-core-signal-contract.md
    added: 2026-11-04
  - pattern: gesture_call_outside_adapter
    status: active
    description: "No production code except InputAdapter.flush() calls InputResolver.press, move, release, cancel_pointer or recover_if_stuck; cancel() only from cancel_all() and the wrapper's detach(); no drag_cancelled or became_idle listener makes a gesture call or issues a command."
    why: "G1 to G6 listeners may issue commands only because those signals fire inside flush() at frame step 0 (ADR-0006 rule 3)"
    adr: docs/architecture/adr-0008-input-resolver-core-signal-contract.md
    added: 2026-11-04
  - pattern: resolver_new_outside_create
    status: active
    description: "InputResolver.new( appears only in input_resolver.gd and under tests/; production code uses InputResolver.create and checks for null; fakes use FakeResolver.new, never create."
    why: "A constructor cannot refuse bad slops (Input Rule 9); static create is not virtual"
    adr: docs/architecture/adr-0008-input-resolver-core-signal-contract.md
    added: 2026-11-04
  - pattern: vector2_in_dev_log_record
    status: active
    description: "GestureLog and run-log records hold no Vector2; positions are separate x and y fields, serialised with JSON.stringify(data, \"\", true, true)."
    why: "JSON.stringify writes a Vector2 as the string \"(x, y)\" (engine check)"
    adr: docs/architecture/adr-0008-input-resolver-core-signal-contract.md
    added: 2026-11-04
  - pattern: upward_layer_reference
    status: active
    description: "No src/ file references a class or res://src path of a higher layer (foundation < core < feature < presentation < root); no Feature module references a sibling; nothing outside root references root; no uid:// path in src/*.gd."
    why: "GDScript has no module boundaries (architecture.md rules 1 to 6); uid:// would hide the dependency (LAYER-1 to LAYER-5)"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: assert_signal_in_tests
    status: active
    description: "No assert_signal or monitor_signals under tests/; use the recording fake."
    why: "Counts and awaits; no payload types or whole ordered log (TR-input-014)"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: io_or_scene_in_unit_tests
    status: active
    description: "No FileAccess, DirAccess, ConfigFile, ResourceLoader, non-script load or preload, .tscn, instantiate, scene_runner or simulate_* under tests/unit/."
    why: "Unit tests are headless, file-free and deterministic (TR-data-012, TR-enemy-014)"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: skipped_test
    status: active
    description: "No do_skip or skip_reason parameter and no test parameter gdUnit4 does not know (gdUnit4 6.2.0 silently skips such a test)."
    why: "Coding standards: never skip a failing test (TEST-6)"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: class_name_outside_src
    status: active
    description: "No class_name under tests/ or tools/; helpers and test subclasses are preloaded by path."
    why: "Keeps the global namespace and exports free of test names (QQ-16)"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: inline_lint_suppression
    status: active
    description: "No comment that disables a lint rule; exceptions are FILE_EXCEPTIONS rows in tools/lint/lint_rules.gd citing their ADR."
    why: "Inline suppressions erode a gate silently"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: push_warning_in_src
    status: active
    description: "No push_warning in src/."
    why: "With gdUnit4 error reporting on, a warning fails tests; ADR-0001 has no warning tier (ERR-3)"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: unchecked_command_entry
    status: active
    description: "A command (build, upgrade, pin, burst, start_wave, call_early, pause, resume) whose first statement is not the injected between_ticks() check, or that answers a failed check with anything but fatal."
    why: "A mid-tick command can only come from a wiring defect; Principle 5 forbids a silent fallback"
    adr: docs/architecture/adr-0010-sim-input-split-command-result-codes-dev-telemetry.md
    added: 2026-11-04
  - pattern: input_class_mutates_sim
    status: active
    description: "TowerInput, HeroInput, HudLogic or a bot writes a sim field or calls a tick entry; they change state only through the commands."
    why: "Keeps bots and players on one door (TR-tower-001, TR-hero-001, TR-hero-012)"
    adr: docs/architecture/adr-0010-sim-input-split-command-result-codes-dev-telemetry.md
    added: 2026-11-04
  - pattern: dev_log_in_release
    status: active
    description: "RunLog, GestureLog, JsonlFileSink or DevLogs created when OS.is_debug_build() is false, or a dev-log failure that calls fatal."
    why: "TR-hud-013, TR-input-015: release never writes; a log failure is never fatal"
    adr: docs/architecture/adr-0010-sim-input-split-command-result-codes-dev-telemetry.md
    added: 2026-11-04
  - pattern: absent_branch_in_production
    status: active
    description: "A Builder option, null check or factory in src/ that exists only so a test can run without HeroSim (or another system); tests swap in a tests/helpers subclass instead."
    why: "Hero criterion 28 is proven without a production test branch (ADR-0010 Decision 9)"
    adr: docs/architecture/adr-0010-sim-input-split-command-result-codes-dev-telemetry.md
    added: 2026-11-04
  - pattern: command_inside_tick_v2
    status: active
    description: "No command (pin, burst, build, upgrade, start_wave, call_early, pause, resume) runs inside Battle.tick, from a signal listener, or from a real-time model's advance or update; enforced at run time in every build by the between_ticks() check (ADR-0010)."
    why: "Commands apply only between ticks (TR-state-004); displayed must equal paid (TR-hud-005)"
    adr: docs/architecture/adr-0010-sim-input-split-command-result-codes-dev-telemetry.md
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
      - docs/architecture/adr-0010-sim-input-split-command-result-codes-dev-telemetry.md
    added: 2026-11-04
  - pattern: canvas_shader_or_particles_in_battle
    status: active
    description: "No CanvasItem material, shader, Light2D, CanvasModulate or particle node in the battle at MVP; effects are alpha and shapes in _draw."
    why: "Combat GDD forbids them; TIME ignores Pause and the view clock; batching cost unsourced (QQ-10)"
    adr: docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
  - pattern: draw_reads_sim
    status: active
    description: "No _draw() calls a sim query or holds a sim object; models copy reads into buffers in refresh or a P7 to P9 handler."
    why: "A redraw after detach() would touch a freed battle; keeps the weakref proof valid"
    adr: docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
  - pattern: view_engine_clock
    status: active
    description: "No view duration reads Engine, Time, Timer, delta or a shader TIME; every view clock runs on view_ms."
    why: "View clocks stop on Pause and clear on retry (Combat V/A)"
    adr: docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
  - pattern: lambda_in_src
    status: active
    description: "No lambda anywhere in src/, stored, connected, injected or passed (sort_custom takes obj.method)."
    why: "Flat form of ADR-0001's callable rule, lintable (WIRE-3)"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
  - pattern: assert_or_free_in_src
    status: active
    description: "No assert( and no free() on any object in src/; nodes use queue_free() after remove_child() and detach()."
    why: "assert is stripped in release; free() in a live call runs on freed objects (ERR-1, ERR-4)"
    adr: docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04


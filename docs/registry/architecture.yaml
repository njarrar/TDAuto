#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_singleton
    status: active
    description: "project.godot has no [autoload] section; no script reaches state through /root/<Name>. The catalogue and the battle are passed down from AppRoot."
    why: "Global state survives a retry and cannot be built headless (TR-data-011, TR-state-001)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: capturing_callable_injection
    status: active
    description: "No lambda, bind() or bindv() result as an injected callable or signal target; method Callables only, on a target held by Battle, BattleWrapper or AppRoot. Bans every lambda under src/battle/."
    why: "bind() holds its bound RefCounted arguments and a capturing lambda holds its captures, so the old battle survives a retry (4.7.2 probe)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: refcounted_back_reference
    status: active
    description: "No object Battle holds stores a reference to Battle or to an object that holds it; no two sims hold each other. Reads go through method Callables such as battle.halted."
    why: "A RefCounted cycle is never released and the weakref test sees only the objects it names (4.7.2 probe)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: static_var_in_gameplay
    status: active
    description: "No static var under src/battle/."
    why: "A static var persists across instances and so outlives a retry (4.7.2 probe)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: node_in_gameplay_class
    status: active
    description: "Classes under src/battle/ extend RefCounted, never Node, and never reference Engine, Time, OS, SceneTree, a Timer or await."
    why: "The battle must build and tick headless with no scene and no engine clock (TR-state-002)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: wrapper_references_app_root
    status: active
    description: "Nothing under src/presentation/ or in the wrapper names AppRoot as a type; the wrapper receives AppRoot.request_retry as a Callable."
    why: "A reference back to AppRoot is a preload cycle and couples the fatal path to presentation scripts."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: catalogue_directory_scan
    status: active
    description: "The catalogue loads only the files named in assets/data/manifest.json; no runtime directory listing, no load of an unlisted file."
    why: "Exported builds rename and package files, and an unlisted stray file would silently join the catalogue (Data Rule 4, TR-data-003)."
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
  - pattern: catalogue_fallback_value
    status: active
    description: "No default, clamp, round or truncation of a catalogue value in the validator, builder or any reader; a bad value is a collected error and a Failed load."
    why: "A silently defaulted value corrupts balance and the hero-share metric (Data Rule 8, TR-data-006)."
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
  - pattern: catalogue_record_mutation
    status: active
    description: "No code outside CatalogueBuilder assigns a record field or mutates a record's arrays; there is no reload after READY."
    why: "Definitions are read-only after load (Data Rule 6); the engine does not enforce it, so a deep-snapshot test and a lint do."
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
  - pattern: catalogue_scene_load_at_boot
    status: active
    description: "scene_ref is a String path; the catalogue never loads or instances a scene. The content test and ADR-0001's runtime load() null check cover it."
    why: "Checking scenes at load would mean instancing every stage (Data Rule 9)."
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
  - pattern: input_event_read_outside_read_pointer
    status: active
    description: "Only InputAdapter.read_pointer tests InputEvent subclasses or reads their fields; InputAdapter and HudModals call it. No gameplay or HUD code names InputEventMouse*, InputEventKey or event.device."
    why: "Two translations of the same events drift apart (event family, canceled flag)."
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    added: 2026-11-05
  - pattern: scene_tree_paused_for_flow_pause
    status: active
    description: "Pause is Flow's PAUSED state; get_tree().paused is never set."
    why: "A second pause mechanism needs process_mode on every always-running node and its Control and input behaviour is not in the engine reference."
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    added: 2026-11-05
  - pattern: stat_value_caching
    status: active
    description: "No consumer stores a value returned by the accessor beyond the tick step that read it. The one exception is max_hp, read once at spawn to seed Health."
    why: "A cached value would ignore a modifier or a spy change and break the resolver seam (TR-data-008)."
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
  - pattern: shared_read_context
    status: active
    description: "Two callers never share a ReadContext, and a new context is never built per read; each owner makes one when its entity comes to exist."
    why: "Sharing lets one caller change level under another; per-read allocation costs hundreds of objects per tick."
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
  - pattern: strong_live_entity_on_context
    status: active
    description: "ReadContext.live_entity is always a WeakRef (weakref(null) for a preview), never null and never a strong reference to the entity."
    why: "The entity owns its context, so a strong back-reference is a RefCounted cycle (ADR-0001's refcounted_back_reference)."
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
  - pattern: use_value_after_bad_stat_call
    status: active
    description: "After a stat read, the caller checks halted() (HUD: phase() == FATAL) before using the value; the value returned after a bad call is never used."
    why: "Typed GDScript cannot express a number or nothing, so the latch is the only failure signal."
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
  - pattern: built_tower_level_set_before_commit
    status: active
    description: "A built tower's ReadContext.level is written only inside the build or upgrade commit, after the gold debit and before any emit; command-time cost reads use TowerSim's separate command context."
    why: "Setting the tower's own level to L+1 to read a cost corrupts damage and range reads when the command is then refused (TR-tower-003)."
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
  - pattern: physics_process_anywhere
    status: active
    description: "No node defines _physics_process and no project code reads or sets Engine.time_scale, physics_ticks_per_second, max_physics_steps_per_frame or physics_jitter_fix."
    why: "Their behaviour is not in the engine reference and the sim needs one clock and one callback order."
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    added: 2026-11-05
  - pattern: sim_time_outside_tick
    status: active
    description: "No _process, Timer, await or wall-clock read in src/battle/; sim time enters only as the dt argument of Battle.tick."
    why: "Pure function of (catalogue, stage_id, seed, command script) (TR-state-003)."
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    added: 2026-11-05
  - pattern: command_inside_tick
    status: active
    description: "No command is issued or queued from inside a tick; no sim calls another sim's command method."
    why: "Commands apply only between ticks (TR-state-004)."
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    added: 2026-11-05
  - pattern: view_clock_on_sim_tick
    status: active
    description: "No view or HUD duration is driven by a sim tick or sim signal; each is advance(view_dt) on the frame clock."
    why: "The clearance tail, Won's beat and view effects must run after the battle clock stops and freeze under Pause."
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-and-determinism.md
    added: 2026-11-05
  - pattern: hp_change_outside_deliver
    status: active
    description: "No code writes Health.hp or a Status field except Combat.attach, deliver, apply_slow and tick_status; no damage by any other route."
    why: "The per-source counters and hero share are exact only if every HP change passes deliver (TR-combat-003)."
    adr: docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    added: 2026-11-05
  - pattern: roster_removal_outside_leak_and_reap
    status: active
    description: "An enemy leaves the roster only in EnemyWave's leak step (slot 2) or reap step (slot 6); nothing else sets removed or erases from the owning list; both steps use an index loop with no advance after remove_at; spawn_id is never reused."
    why: "Leaks resolve before fire and kills pay once in the reap; any other removal breaks the tick order and the clear check (ADR-0004)."
    adr: docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    added: 2026-11-05
  - pattern: roster_list_held_past_slot
    status: active
    description: "roster() and targets() return reused buffers; callers never store, mutate or sort them past the slot that read them."
    why: "The buffers are refilled in place, so a held reference changes under the holder."
    adr: docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    added: 2026-11-05
  - pattern: targetable_as_node
    status: active
    description: "Targetable, Enemy, Health and Status extend RefCounted, never Node or Resource."
    why: "A freed node cannot honour removed and a node's position collides with the cached one (TR-combat-002)."
    adr: docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    added: 2026-11-05
  - pattern: core_combat_names_feature_class
    status: active
    description: "combat.gd, targetable.gd, health.gd, status.gd and damage_event.gd never name Enemy, EnemyWave, TowerSim or HeroSim."
    why: "Combat is Core and EnemyWave is Feature but both live in src/battle/, so a path lint cannot enforce the layer boundary."
    adr: docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    added: 2026-11-05
  - pattern: for_in_over_mutated_roster
    status: active
    description: "No for-in loop over the owning roster list while the body can remove from or append to it; use an index loop that does not advance after remove_at."
    why: "4.7.2 probe: for-in with an erase in the body skips the next element silently, so adjacent leaks or kills slip a tick."
    adr: docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    added: 2026-11-05
  - pattern: emit_before_commit
    status: active
    description: "No battle signal is emitted before the transition's state is final (roster removal, gold, lives, phase, built tower level); a refusal emits nothing."
    why: "A handler can read the sim at any moment (TR-tower-004, TR-enemy-004)."
    adr: docs/architecture/adr-0006-battle-signal-contracts-and-view-allowlist.md
    added: 2026-11-05
  - pattern: observer_steers_sim
    status: active
    description: "No observer handler calls a Flow, TowerSim or HeroSim command or Combat.deliver, emits a battle signal, or writes sim state; deferred work runs in advance(ms) or the view step."
    why: "Views observe, never steer (Principle 4); a battle without observers must be identical (TR-hud-004)."
    adr: docs/architecture/adr-0006-battle-signal-contracts-and-view-allowlist.md
    added: 2026-11-05
  - pattern: sim_connects_to_view
    status: active
    description: "No class under src/battle/ connects to, holds or names a presentation object; observers connect only in BattleWrapper.setup()."
    why: "Headless battle has no view and must be identical."
    adr: docs/architecture/adr-0006-battle-signal-contracts-and-view-allowlist.md
    added: 2026-11-05
  - pattern: signal_connect_flags
    status: active
    description: "No CONNECT_DEFERRED, CONNECT_ONE_SHOT, CONNECT_REFERENCE_COUNTED or CONNECT_PERSIST on a battle signal."
    why: "Delivery must be synchronous and the listener count stable for the wiring test."
    adr: docs/architecture/adr-0006-battle-signal-contracts-and-view-allowlist.md
    added: 2026-11-05
  - pattern: signal_named_like_method
    status: active
    description: "No signal shares a name with a method on its class (phase_changed and phase())."
    why: "Signal plus method of one name fails to parse on 4.7.2."
    adr: docs/architecture/adr-0006-battle-signal-contracts-and-view-allowlist.md
    added: 2026-11-05
  - pattern: observer_calls_deliver
    status: active
    description: "No `.deliver(` call outside src/battle/ (structural lint, ADR-0007); `in_dispatch()` does not guard deliver."
    why: "Sims legitimately call deliver inside a tick, so the guard cannot tell callers apart (TR-combat-010)."
    adr: docs/architecture/adr-0006-battle-signal-contracts-and-view-allowlist.md
    added: 2026-11-05
  - pattern: signal_target_lambda_outside_battle
    status: active
    description: "No `connect(func` or `.bind(` under src/presentation/ or src/app/; signal targets are method Callables everywhere (lint, ADR-0007)."
    why: "The listener-count test reads each target's method name; extends ADR-0001's src/battle/ ban."
    adr: docs/architecture/adr-0006-battle-signal-contracts-and-view-allowlist.md
    added: 2026-11-05
  - pattern: connection_introspection_in_src
    status: active
    description: "No `get_connections()` or `get_signal_connection_list()` under src/; test-only."
    why: "Each call allocates an Array of Dictionary; the wiring test is its only user."
    adr: docs/architecture/adr-0006-battle-signal-contracts-and-view-allowlist.md
    added: 2026-11-05
  - pattern: resolver_reads_engine_input_or_time
    status: active
    adr: docs/architecture/adr-0008-input-resolver-core-and-signal-contract.md
    tr: [TR-input-001]
    rule: "input_resolver.gd must never reference InputEvent, Node, Time, Engine, OS, DisplayServer, Input, a camera or the scene tree; it is driven only by its five calls"
    added: 2026-11-05
  - pattern: resolver_hit_constants_in_resolver
    status: active
    adr: docs/architecture/adr-0008-input-resolver-core-and-signal-contract.md
    tr: [TR-input-007]
    rule: "Hit radii, priorities, edge_reject_margin and slop literals must never appear in input_resolver.gd; owners declare radii and priorities (ADR-0010), slops come from InputRecord by injection"
    added: 2026-11-05
  - pattern: resolver_target_id_reuse_or_dictionary_order
    status: active
    adr: docs/architecture/adr-0008-input-resolver-core-and-signal-contract.md
    tr: [TR-input-007]
    rule: "Target ids must never be reused or lowered; the hit-test tie-break must iterate the ascending id array and never rely on Dictionary iteration order"
    added: 2026-11-05

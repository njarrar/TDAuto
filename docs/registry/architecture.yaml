# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: injected_and_connected_callables
    status: active
    api: "obj.method and emitter.signal_name.connect(listener.method)"
    not: "Callable(obj, name) string form, connect(name, ...) string form, lambdas, bind()"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "Parser-checked wiring; lambdas and bind() can hold strong references and make RefCounted cycles"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
      - docs/architecture/adr-0006-battle-signal-contracts-view-allowlist.md
      - docs/architecture/adr-0008-input-resolver-core-signal-contract.md
      - docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
    revised: ""
  - purpose: release_relevant_checks
    status: "superseded_by: ADR-0009"
    api: "injected fatal or dev_error plus push_error"
    not: "assert, print_debug"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "assert and print_debug are stripped from export builds"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - purpose: app_root_scene_loading
    status: active
    api: "ResourceLoader.load() with a null check, then instantiate()"
    not: "preload in app_root.gd"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "A failed preload fails the script that holds the fatal fallback"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0007-headless-test-harness-gdunit4-layer-lint.md
    added: 2026-11-04
    revised: ""
  - purpose: retry_node_teardown

# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: battle_wrapper_teardown
    status: active
    api: "process_mode = PROCESS_MODE_DISABLED, view_wiring.disconnect_all(), remove_child(wrapper), wrapper.queue_free(), then battle.unwire(), from AppRoot._process"
    not: "wrapper.free()"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "Acts outside the wrapper call stack; remove_child stops processing and input at once; queue_free deletes at frame end"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0001 Accepted 2026-11-04; binding"
  - purpose: catalogue_storage_format
    status: active
    api: "JSON files in res://assets/data/catalogue/, listed in manifest.json, read with FileAccess.open + get_as_text and parsed by a JSON instance; one schema table per record type"
    not: ".tres/.res Resources, load() or ResourceLoader for catalogue data"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    reason: "A .tres load hides a missing field, an unknown property and a fractional int before any check can see them"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0002 Accepted 2026-11-04; binding"
  - purpose: catalogue_read_only_snapshot
    status: active
    api: "CatalogueSnapshot.take() schema walk into fresh containers, CatalogueSnapshot.diff(); make_read_only() on every record Array and Dictionary"
    not: "duplicate() or duplicate_deep() for the snapshot"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    reason: "Records are RefCounted, so duplicate_deep() (a Resource method) does not apply; duplicate() on nested arrays is shallow"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0002 Accepted 2026-11-04; binding"
  - purpose: display_stretch
    status: active
    api: "viewport 540x960, stretch mode canvas_items, aspect keep, scale 1.0, scale_mode fractional, portrait, window mode 0 (mode.mobile 3), Android edge-to-edge on, quit_on_go_back false; effective values checked through ProjectSettings"
    not: "aspect expand or keep_width (4.7 new-project default is expand); Camera2D in the battle"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "Only keep makes field units equal viewport units with no offset; letterbox absorbs most notch insets"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    revised: "2026-11-03"
    notes: "ADR-0003 Accepted 2026-11-04; binding"
  - purpose: pointer_event_source
    status: active
    api: "emulate_touch_from_mouse false, emulate_mouse_from_touch true; InputAdapter drops device == InputEvent.DEVICE_ID_EMULATION; TapScreen reads the mouse family only, real or emulated, and must not drop it; identify source by event class"
    not: "event.device == 0; touch-only family with mouse emulated as touch 0"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "One forwarded press per physical press; Controls still get emulated mouse on phones; spike S2 verifies"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    revised: "2026-11-03"
    notes: "ADR-0003 Accepted 2026-11-04; binding"
  - purpose: app_lifecycle_pause
    status: active
    api: "Union of NOTIFICATION_APPLICATION_FOCUS_OUT, NOTIFICATION_APPLICATION_PAUSED, NOTIFICATION_WM_WINDOW_FOCUS_OUT in InputAdapter._notification, latched per episode; NOTIFICATION_WM_GO_BACK_REQUEST pauses each time; fallback get_window().focus_exited if spike S5 shows window focus reaches only the Window"
    not: "SceneTree.paused; resume on focus-in"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "Which notifications fire per platform is unverified (spike S5); pause is idempotent and resume is by tap only"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    revised: "2026-11-03"
    notes: "ADR-0003 Accepted 2026-11-04; binding"
  - purpose: tick_driver
    status: active
    api: "Own accumulator in a pure TickClock, advanced from BattleWrapper._process(delta) through step(delta); 60 Hz fixed tick; frame order real-time models, ticks, view refresh; application/run/max_fps 60 in project settings"
    not: "_physics_process, Engine.physics_ticks_per_second, max_physics_steps_per_frame, Timer nodes, variable dt"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    reason: "The accumulator must be zeroed on pause and clamped by this project; one callback keeps shown bonus equal to paid bonus whatever spike S1 finds"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    added: 2026-11-04
    revised: "2026-11-04"
    notes: "ADR-0004 Accepted 2026-11-04; binding"
  - purpose: sim_randomness
    status: active
    api: "No sim RNG at MVP; later, one RandomNumberGenerator per consumer, made by the Builder and seeded splitmix64(rng_seed * 1_000_003 + SALT); cosmetic RandomNumberGenerator owned by the wrapper only"
    not: "global randi/randf/randomize/seed, Array.shuffle(), Array.pick_random(), one shared sim stream"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    reason: "Per-consumer streams keep baselines stable when a consumer is added; global draws break the seed contract"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    added: 2026-11-04
    revised: "2026-11-04"
    notes: "ADR-0004 Accepted 2026-11-04; binding"
  - purpose: stat_key_format
    status: active
    api: "StringName constants in StatKeys, named after schema fields; untyped const Dictionary tables; value fetched with Object.get(key) on the record or TowerLevel"
    not: "String literal or &-literal keys at call sites, int enum keys, Variant stat() read, typed Dictionary const (4.4+, unverified offline)"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    reason: "One key list checked against schema.gd; pointer compare; matches future modifier data with no map; match-per-key is the fallback if perf check P1 fails"
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
    revised: ""
    notes: "ADR-0005 Proposed 2026-11-04; not binding until Accepted"


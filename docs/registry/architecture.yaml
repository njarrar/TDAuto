# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: catalogue_storage
    status: active
    api: "JSON text files under res://data/catalogue/ listed in manifest.json, read by FileAccess and an instance JSON parser, checked against a code schema table"
    not: "custom Resource .tres files via ResourceLoader"
    adr: docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    reason: "Missing-field detection (TR-data-004) cannot rest on Resource defaults, which the pinned reference does not cover"
    referenced_by:
      - docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    added: 2026-11-02
    revised: ""
  - purpose: wiring_test_signal_set
    status: active
    api: "(get_script() as Script).get_script_signal_list() and get_signal_connection_list(name) over battle.systems() and every wrapper-built object"
    not: "a hand-written list of signals in the test"
    adr: docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    reason: "A derived set covers new signals with no edit; a hand list goes stale"
    referenced_by:
      - docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    added: 2026-11-02
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"

# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: catalogue_load
    status: active
    budget_ms: 1000
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    notes: "Median Loading to Ready over 5 cold launches on one Adreno 5xx-class device (TR-data-015); fallback to a worker if the median exceeds 1000 ms or any launch exceeds 2500 ms; unmeasured until a phone build"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
    revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_singleton
    status: active
    description: "No [autoload] section in project.godot and no global singleton. Inject through BattleBuilder or constructors."
    why: "Breaks headless runs and makes retry a hand-written reset"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: sim_back_reference_to_battle
    status: active
    description: "No sim object stores Battle in a field, and no RefCounted cycle exists in battle code."
    why: "GDScript has no cycle collector; a cycle leaks the old battle on retry"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: session_object_holds_battle_callable
    status: "superseded_by: ADR-0005"
    description: "AppRoot, Catalogue, the stat accessor and records never hold a per-battle callable or connect to a per-battle signal; no sim connects to a catalogue signal."
    why: "Either leaks the old battle or sends a later fatal to a dead relay"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: session_object_holds_battle_callable_v2
    status: active
    description: "AppRoot, Catalogue and records never hold a per-battle callable, a ReadContext, or connect to a per-battle signal; no sim connects to a catalogue signal. The StatAccessor is per battle and may hold the battle's fatal."
    why: "Either leaks the old battle or sends a later fatal to a dead relay"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
  - pattern: entity_holds_own_read_context
    status: active
    description: "An entity (enemy, tower, hero) never stores its own ReadContext; the owning system holds contexts keyed by spawn_id or slot and drops them with the entity."
    why: "ReadContext.live_entity points at the entity; both holding each other is a RefCounted cycle that never frees"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-read-context-contract.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: stat_key_literal
    status: active
    description: "Stat keys are always StatKeys constants, never string or StringName literals, at stat_int and stat_float call sites."
    why: "A misspelt constant is a parse error; a misspelt literal is a run-time fatal"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
  - pattern: cached_stat_value
    status: active
    description: "No value read from the StatAccessor is stored for later use, except max_hp seeding Health at spawn."
    why: "Vertical Slice modifiers must take effect with no call-site change (TR-data-008)"
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-read-context-contract.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: mutable_static_var
    status: active
    description: "No mutable static var in any class under src/."
    why: "Static state survives a retry and defeats the rebuild"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: in_place_reset
    # Note (ADR-0004): BattleClock.drop_backlog() is a wrapper clock call, not a sim reset; a lint must not flag it.
    status: active
    description: "No reset() on battle systems; retry rebuilds the whole battle."
    why: "Hand-listed resets leak state between attempts (prototype, 22 fields)"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: teardown_inside_signal_or_fatal
    status: active
    description: "Never free the wrapper or drop the battle from inside a signal handler or a fatal call; only AppRoot._process tears down."
    why: "The caller would run on freed objects"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
  - pattern: default_for_missing_field
    status: active
    description: "No code supplies a default for a missing catalogue field, in any build."
    why: "A silent default corrupts balance and the hero-share metric (Data & Config Rule 8)"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
  - pattern: record_object_reference
    status: active
    description: "A record stores other records only by StringName ID, never as an object reference or file path (owned sub-data excepted)."
    why: "Keeps records read-only, snapshot-safe and free of cycles"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: method_named_load
    status: active
    description: "No method named load in src/."
    why: "It shadows GDScript's global load() inside its class"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
  - pattern: core_names_feature_enemy
    status: active
    description: "No code under src/core/ names Enemy or any Feature class; Combat takes and returns Targetable, lists are Array[Targetable] from creation."
    why: "Upward dependency (layer rule 1); typed arrays are invariant"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: combat_piece_back_reference
    status: active
    description: "Health and Status hold no reference to their Targetable or any object; Enemy holds no ReadContext, EnemyWave, Combat, Battle or Callable."
    why: "A back-reference is a RefCounted cycle that never frees"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: hp_change_outside_deliver
    status: active
    description: "No code writes hp, max_hp, strength or ticks_left outside src/core/combat/; every HP change goes through deliver inside a tick."
    why: "Counters and hero share would be bypassed (Combat Rule 2)"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: mutate_roster_view
    status: active
    description: "No caller appends to, erases from, sorts, clears or keeps the arrays returned by roster() or targets(); filtered lists go in the caller's own buffer."
    why: "They are EnemyWave's internal buffers; mutation corrupts the sole-owner roster"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: listener_stores_damage_event
    status: active
    description: "No damage_applied listener stores the DamageEvent or reads event.target; views use the copied position and spawn_id."
    why: "Keeps reaped enemies alive and makes views depend on sim objects"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: remove_during_foreach
    status: active
    description: "No element is removed from an array inside a for-in loop over it; removal loops are while i < arr.size() index loops that do not advance i after remove_at(i)."
    why: "Skips the next element and misses children appended by listeners (Enemy & Wave Acceptance 28)"
    adr: docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
  - pattern: engine_input_outside_adapter
    status: active
    description: "No _input or _unhandled_input override, and no Input pointer polling, in src/ outside InputAdapter; modal screens read their own events in _gui_input only."
    why: "Two readers of engine input break one-press-one-gesture and the exactly-one-ending contract"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: tappable_non_modal_control
    status: active
    description: "Every battle Control except the Result and Paused modal screens uses MOUSE_FILTER_IGNORE; game targets are resolver discs, never Controls."
    why: "Control, Panel and ColorRect default to STOP, and PASS also takes a touch press, so any other filter swallows presses meant for discs"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: mouse_event_in_battle_code
    status: active
    description: "No InputEventMouseButton read and no Button.pressed use in battle code; the adapter and modal screens read the touch family."
    why: "Mouse emulation follows touch index 0 only, so a second finger is lost"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: device_id_literal
    status: active
    description: "Never compare InputEvent.device to a number; compare event types, or device to InputEvent.DEVICE_ID_* constants."
    why: "4.7 moved mouse and keyboard off device 0, which some joypads use"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: battle_camera_or_canvas_transform
    status: active
    description: "No Camera2D and no non-identity canvas transform on the battle field."
    why: "Field units must equal viewport units (TR-input-016)"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: scene_tree_pause
    status: active
    description: "Never use get_tree().paused for the lifecycle pause; pause is Flow's PAUSED phase and the in-sim tick gate."
    why: "One pause mechanism; the sim is plain objects ticked by the wrapper"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: canceled_touch_as_release
    status: active
    description: "A touch with canceled true is cancel_pointer, never release, in the adapter and in modal screens."
    why: "An OS cancel treated as a release fires a tap or a drag end: a mis-fire"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-04
  - pattern: engine_time_in_sim
    status: active
    description: "No _process, _physics_process, Timer, create_timer, await, Engine.time_scale, Engine.get_frames_drawn, Engine.get_process_frames, Engine.get_physics_frames, Time.* or OS.get_ticks_* in sim code or in real-time models; _process only in BattleWrapper, AppRoot and InputAdapter (SP12 poll); no get_tree().paused; no low_processor_mode; delta_smoothing off."
    why: "Sim time must enter only through Battle.tick, and the frame order must be one function"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: float_duration_countdown
    status: active
    description: "No sim countdown is a float; no code subtracts dt from a duration; every authored duration goes through to_ticks once."
    why: "Float countdowns drift (5.0 s took 301 ticks)"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: command_inside_tick
    status: active
    description: "No command (pin, burst, build, upgrade, start_wave, call_early, pause, resume) runs inside Battle.tick, from a signal listener, or from a real-time model's advance or update."
    why: "Commands apply only between ticks (TR-state-004); displayed must equal paid (TR-hud-005)"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: sim_nondeterministic_math
    status: active
    description: "No floor, ceil, abs, sign (Variant-returning; use floorf/floori, ceilf/ceili, absf/absi), round, sin, cos, tan, atan2, pow, exp, log, fmod, fposmod, lerp, move_toward, snapped or Vector2/Vector3 method on a value that reaches sim state."
    why: "Platform maths libraries may differ; round()'s half rule is unsourced"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: engine_rng_in_sim
    status: active
    description: "No RandomNumberGenerator or global random function in sim code; Presentation randomness never reads rng_seed or sim_rng."
    why: "Same seed and script must give the same result; cosmetic jitter must not touch the sim (TR-enemy-007)"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: hero_input_sync_before_ticks
    status: active
    description: "HeroInput.update() never runs before the frame's ticks; it runs first in frame step 4, so the hit-disc centre and aim_point() match the drawn frame."
    why: "Before the ticks, a press on a walking hero is tested against where it was a frame earlier (TD-ADR T2)"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
  - pattern: unordered_iteration_in_sim
    status: active
    description: "No sim result or payload depends on Dictionary iteration order, instance IDs or object hashes; iterate arrays in spawn_id or slot order."
    why: "Determinism per architecture (TR-combat-014); Dictionary order is unsourced"
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04


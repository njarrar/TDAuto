# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: battle_construction
    status: active
    pattern: direct_call
    producer: battle-builder
    consumers:
      - app-root
      - test-harness
      - bots
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "BattleBuilder.build(catalogue: Catalogue, stage_id: StringName, rng_seed: int, fatal_handler: Callable) -> Battle (null if a fatal fired during build)"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - contract: fatal_reporting
    status: active
    pattern: direct_call
    producer: all-battle-systems
    consumers:
      - fatal-relay
      - app-root
      - flow
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "fatal(cause: String) -> void, injected; idempotent, first cause kept; caller checks halted() and returns"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - contract: battle_teardown
    status: active
    pattern: direct_call
    producer: app-root
    consumers:
      - battle-wrapper
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "BattleWrapper.attach(battle: Battle, reduce_motion: bool) -> bool; BattleWrapper.detach() -> void clears every sim, resolver and Battle reference in the wrapper subtree"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - contract: catalogue_load
    status: active
    pattern: direct_call
    producer: data-config
    consumers:
      - app-root
      - test-harness
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    signal_signature: "static Catalogue.load_manifest(manifest_path: String) -> LoadResult; static Catalogue.from_data(source_label: String, data: Dictionary) -> LoadResult; LoadResult{ok, errors: Array[ValidationError], catalogue}"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
    revised: ""
  - contract: validation_error_shape
    status: active
    pattern: none
    producer: data-config
    consumers:
      - app-root
      - content-tests
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    signal_signature: "ValidationError{code: StringName, source: String, record_id: StringName, field: StringName}; closed code list in ADR-0002 Decision 3"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
    revised: ""
  - contract: stat_read_context
    status: active
    pattern: direct_call
    producer: data-config
    consumers:
      - enemy-wave
      - tower-sim
      - hero-sim
      - battle-hud
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    signal_signature: "ReadContext{def_id: StringName, level: int = 0, live_entity: Object = null}; one per caller, created with its owner, reused, held by the owning system"
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    added: 2026-11-04
    revised: ""


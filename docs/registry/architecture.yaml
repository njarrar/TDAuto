# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: Mobile
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    added: 2026-11-04
    revised: ""
    notes: "ADR-0004 Accepted 2026-11-04; binding"
  - system: simulation
    status: active
    budget_ms: 4.0
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    notes: "All ticks in one frame; one tick at most 2.0 ms p95 on an Adreno 5xx-class phone; unmeasured (QQ-11). ADR-0004 Accepted 2026-11-04; binding"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-frame-order-determinism.md
    added: 2026-11-04
    revised: ""


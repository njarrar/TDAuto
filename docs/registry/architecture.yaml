# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: stat_read
    status: active
    pattern: direct_call
    producer: data-config-pipeline
    consumers:
      - tower-system
      - hero-system
      - enemy-wave
      - battle-hud
    adr: docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    signal_signature: "StatAccessor.get_float(ctx: ReadContext, key: StringName) -> float; get_int(ctx, key) -> int; bad call calls the injected handler and returns a typed zero no caller may use"
    referenced_by:
      - docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    added: 2026-11-02
    revised: ""
  - contract: battle_signal_wiring
    status: active
    pattern: signal
    producer: every battle system (StageFlow, WaveSim, TowerSim, HeroSim, Combat), GestureResolver, TowerInput, HeroInput, BattleWrapper
    consumers:
      - battle systems (connected in BattleBuilder.build)
      - views and Battle HUD (connected in BattleWrapper)
    adr: docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    signal_signature: "Canonical table in ADR-0002 section 4; typed parameters; connected only in BattleBuilder.build or BattleWrapper with signal.connect(bound_method); each battle system declares const VIEW_SIGNALS"
    referenced_by:
      - docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    added: 2026-11-02
    revised: ""
  - contract: system_snapshot
    status: active
    pattern: direct_call
    producer: every battle system
    consumers:
      - headless harness
      - replay tests
    adr: docs/architecture/adr-0004-headless-battle-harness-and-snapshot.md
    signal_signature: "snapshot() -> Dictionary with first key system; const SNAPSHOT_EXEMPT and SNAPSHOT_KEYS on every system; compared with SnapshotTool.diff, never =="
    referenced_by:
      - docs/architecture/adr-0004-headless-battle-harness-and-snapshot.md
    added: 2026-11-02
    revised: ""
  - contract: battle_parts
    status: active
    pattern: direct_call
    producer: BattleBuilder
    consumers:
      - Battle
    adr: docs/architecture/adr-0004-headless-battle-harness-and-snapshot.md
    signal_signature: "Battle built from BattleParts (typed nullable flow, combat, wave, tower, hero, latch, slots: Array[TickSlot])"
    referenced_by:
      - docs/architecture/adr-0004-headless-battle-harness-and-snapshot.md
    added: 2026-11-02
    revised: ""
  - contract: input_block
    status: active
    pattern: direct_call
    producer: Battle HUD, FatalScreen
    consumers:
      - PointerGate
    adr: docs/architecture/adr-0006-stretch-mode-coordinate-space-safe-area-hud-layering.md
    signal_signature: "set_input_blocked(blocked: bool): forwards nothing while blocked and never cancels; step 1g cancel closes the open press"
    referenced_by:
      - docs/architecture/adr-0006-stretch-mode-coordinate-space-safe-area-hud-layering.md
    added: 2026-11-02
    revised: ""
  - contract: app_services
    status: active
    pattern: direct_call
    producer: AppRoot
    consumers:
      - Battle HUD
      - BattleWrapper
    adr: docs/architecture/adr-0008-app-lifecycle-and-battle-composition.md
    signal_signature: "AppServices.request_retry(), set_call_prompt_done(); ResumeCommand and StageFlow.resume() -> int (OK, HALTED, NOT_PAUSED)"
    referenced_by:
      - docs/architecture/adr-0008-app-lifecycle-and-battle-composition.md
    added: 2026-11-02
    revised: ""


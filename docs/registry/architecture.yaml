# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: Mobile
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
    revised: ""
  - system: simulation
    status: active
    budget_ms: 4.0
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    notes: "Per frame at 60 fps, including catch-up: MAX_TICKS_PER_FRAME (3) whole ticks, so one worst-case tick must fit 1.33 ms (ADR-0005's 0.5 ms stat-read ceiling and ADR-0009's targeting inside it). Proposed, unmeasured until ADR-0004 V6 on an Adreno 5xx-class device"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
      - docs/architecture/adr-0005-stat-accessor-read-context-contract.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
    revised: ""
  - system: stat-reads
    status: active
    budget_ms: 0.5
    adr: docs/architecture/adr-0005-stat-accessor-read-context-contract.md
    notes: "All stat reads in one tick, Adreno 5xx class (ADR-0005 Performance). Sits inside ADR-0004's 1.33 ms whole-tick figure. Proposed, unmeasured; registered here because ADR-0005 claimed it but registered no budget"
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-read-context-contract.md
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
    revised: ""
  - system: whole-tick
    status: active
    budget_ms: 1.33
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    notes: "One worst-case battle.tick (48 alive, five towers, hero and burst), p99 on Adreno 5xx class = 4.0 / MAX_TICKS_PER_FRAME (3, provisional). Contains stat-reads (0.5 ms) and ADR-0009 targeting (GDD ceiling 2.0 ms, TR-combat-013, so a GDD-compliant tick can still miss this). Reopen: p99 > 1.33 ms sets N = 2 (2.0 ms) in place; > 2.0 ms escalates. Measured by ADR-0004 V6 / ADR-0009 V4 after acceptance"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
      - docs/architecture/adr-0009-enemy-entity-roster-combat-api.md
    added: 2026-11-04
    revised: ""
  - system: input-and-realtime-models
    status: active
    budget_ms: 0.5
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    notes: "Input callbacks plus frame steps 0 (flush, commands) and 1 (HudLogic, ChipWindow). Proposed, unmeasured"
    added: 2026-11-04
    revised: ""
  - system: views-and-hud
    status: active
    budget_ms: 3.0
    adr: docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    # notes before 2026-11-04 revision (ADR-0011): "Frame step 4 (HeroInput.update, view refresh) and _draw; draw calls are ADR-0011's. Proposed, unmeasured. Engine/render/OS 7.0 ms and 2.1 ms headroom complete the 16.6 ms"
    notes: "Frame step 4 (HeroInput.update, view refresh) and _draw; draw calls are ADR-0011's. Proposed, unmeasured. Engine/render/OS 7.0 ms and 2.1 ms headroom complete the 16.6 ms; includes ADR-0011 view-model refresh and CombatViewModel's per-frame max_hp reads (frame-side, outside the per-tick stat-reads budget)"
    referenced_by:
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
    revised: 2026-11-04
  - system: draw-calls
    status: active
    budget_draw_calls: 34
    adr: docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    notes: "Draw calls per frame, counted by ADR-0011 V1's method. Ceiling 60 (project.yaml); this ADR's ceilings sum to 34: FieldBackdrop 3, TowerView 3, EnemyView 4, CombatView 4, HeroView 4 (field 18); HudField 8, HudTopBand 4 (HUD 12, expected 8); one modal 4. Proposed, unmeasured until V2 (prototype) and A1 (first phone build). Time stays in views-and-hud (3.0 ms), which now also counts CombatViewModel's up to 48 max_hp reads per frame"
    referenced_by:
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-04
    revised: ""


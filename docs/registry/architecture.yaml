# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: fatal_handler
    status: active
    pattern: direct_call
    producer: any-sim-builder-accessor
    consumers:
      - fatal-latch
      - app-root
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "fatal(cause: String) -> void, injected as the battle FatalLatch method Callable"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0001 is Proposed; binding only once Accepted"
  - contract: halted_injection
    status: active
    pattern: direct_call
    producer: halt-gate
    consumers:
      - enemy-wave
      - tower-sim
      - hero-sim
      - hud-logic
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "HaltGate.halted() -> bool, injected as a method Callable; never Battle.halted"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0001 is Proposed; binding only once Accepted"
  - contract: battle_wiring
    status: active
    pattern: signal
    producer: battle-builder
    consumers:
      - battle
      - battle-wrapper
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "Wiring.connect_recorded(sig: Signal, target: Callable) for every sim-signal connection, Builder record and wrapper view_wiring; both undone at teardown (view_wiring.disconnect_all(), Battle.unwire())"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0001 is Proposed; binding only once Accepted"
  - contract: catalogue_load
    status: active
    pattern: direct_call
    producer: data-config
    consumers:
      - app-root
      - content-test
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    # was: load_manifest(manifest_path) and from_documents(docs) only (before TD-ADR review)
    signal_signature: "Catalogue.load_manifest(manifest_path: String, data_root: String = DATA_ROOT) -> LoadResult reads bytes only; from_texts(manifest_text, file_texts: Dictionary, data_root) runs Tier 0a with no I/O; from_documents(docs: Array[Dictionary]) runs Tier 0b to 4; LoadResult{ok, errors: Array[ValidationError], catalogue}"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    revised: "2026-11-03"
    notes: "ADR-0002 is Proposed; binding only once Accepted"
  - contract: validation_error_shape
    status: active
    pattern: shared_resource
    producer: data-config
    consumers:
      - app-root
      - fatal-screen
      - content-test
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    signal_signature: "ValidationError{code: StringName, source: String, record_id: StringName, field: StringName, detail: String}; tests compare the first four, never detail"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0002 is Proposed; binding only once Accepted"
  - contract: input_adapter_to_resolver
    status: active
    pattern: direct_call
    producer: input-adapter
    consumers:
      - input-resolver
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    signal_signature: "press from _unhandled_input; move, release, cancel_pointer from _input for forwarded pointers only; cancel() on lifecycle and resize; mouse is pointer MOUSE_POINTER (1 << 16)"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0003 is Proposed; binding only once Accepted"
  - contract: lifecycle_paused
    status: active
    pattern: signal
    producer: input-adapter
    consumers:
      - flow
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    signal_signature: "lifecycle_paused() once per away episode, after resolver.cancel(); wrapper connects it to the method Callable flow.pause; never resumes"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0003 is Proposed; binding only once Accepted"


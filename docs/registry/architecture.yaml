# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: battle_wrapper_teardown
    status: active
    api: "Node.remove_child() then Node.free(), at the top of AppRoot._process"
    not: Node.queue_free()
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-and-fatal-path.md
    reason: "4.7.2 desktop probe: queue_free keeps the old battle alive to frame end; free does not"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-and-fatal-path.md
    added: 2026-11-04
    revised: ""
  - purpose: development_error_reporting
    status: active
    api: "injected dev_error(msg) wrapping push_error()"
    not: assert()
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-and-fatal-path.md
    reason: "assert is stripped from release builds; behaviour guards must survive release"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-and-fatal-path.md
    added: 2026-11-04
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_or_global_state
    status: active
    description: "No autoloads or globals; the [autoload] section of project.godot stays empty. Shared things arrive as injected values, Callables or signals."
    why: "Globals leak state between retries, share one instance across tests and stop headless bots running battles side by side"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-and-fatal-path.md
    added: 2026-11-04
  - pattern: lambda_or_bind_in_battle_wiring
    status: active
    description: "Injected callables and signal connections in a battle are plain method Callables; no lambda, no bind()"
    why: "A capturing lambda keeps its target alive and can defeat teardown; bind() is unprobed"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-and-fatal-path.md
    added: 2026-11-04
  - pattern: reset_in_place
    status: active
    description: "No system exposes reset(); retry rebuilds the whole battle"
    why: "Hand-listed resets leak state between attempts (prototype: 22 fields)"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-and-fatal-path.md
    added: 2026-11-04
  - pattern: sim_targets_node
    status: active
    description: "A RefCounted sim never holds a Callable or connection that targets a Node; nodes connect to sim signals instead"
    why: "Freed wrapper nodes must not be reachable from a sim emit"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-and-fatal-path.md
    added: 2026-11-04


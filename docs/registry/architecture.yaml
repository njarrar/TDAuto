#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: battle_composition
    status: active
    pattern: direct_call
    producer: app-root
    consumers:
      - battle
      - tests-and-bots
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "static BattleBuilder.build(catalogue: Catalogue, stage_id: StringName, rng_seed: int, fatal_handler: Callable) -> Battle (null after fatal_handler when the stage cannot be built; touches no node)"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
    revised: ""
  - contract: fatal_path
    status: active
    pattern: direct_call
    producer: any-battle-system
    consumers:
      - app-root
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "fatal(p_cause: String) -> void on the injected FatalLatch: idempotent, keeps the first cause, forwards to AppRoot.fatal if is_valid(); every caller returns after it and checks halted() after each read and emit"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
    revised: ""
  - contract: input_cancel
    status: active
    pattern: direct_call
    producer: battle-wrapper
    consumers:
      - game-state-stage-flow
      - app-root
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "Battle.set_input_cancel(cancel: Callable) set once by the wrapper; Battle.cancel_input() -> void guarded with is_valid(), called by Flow on Won, Lost, Paused, Fatal and by AppRoot on retry"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
    revised: ""
  - contract: catalogue_load
    status: active
    pattern: direct_call
    producer: data-config
    consumers:
      - app-root
      - tests-and-bots
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    signal_signature: "Catalogue.load_from(manifest_path: String = MANIFEST_PATH) -> CatalogueLoadResult (ok, errors: Array[CatalogueError], cause() -> String); pure core Catalogue.load_parsed(manifest_files: Array[String], docs: Dictionary) -> CatalogueLoadResult; synchronous, main thread, called once by AppRoot in _ready (integration tests may call it on a fresh Catalogue); a second call returns already_loaded; the threaded fallback is a revision of ADR-0002 Decision 7"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
    revised: ""
  - contract: platform_lifecycle_to_pause
    status: active
    pattern: signal
    producer: input-adapter
    consumers:
      - game-state-stage-flow
      - battle-hud
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    signal_signature: "lifecycle_paused() once per focus loss (APPLICATION_FOCUS_OUT, WM_WINDOW_FOCUS_OUT, APPLICATION_PAUSED, deduplicated until a focus-in, ignored until the window has been seen focused); wrapper connects it to Flow.pause and HudLogic.modal_cancel; viewport_resized() on Viewport.size_changed goes to HudLogic.modal_cancel only and never pauses"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    added: 2026-11-05
    revised: ""
  - contract: stat_read
    status: active
    pattern: direct_call
    producer: data-config
    consumers:
      - enemy-wave
      - tower-sim
      - hero-sim
      - hud-logic
      - stat-modifier-vs
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    signal_signature: "StatAccessor.stat_int(ctx: ReadContext, key: StringName) -> int and stat_float(ctx: ReadContext, key: StringName) -> float; key type must match the call; a bad call calls the injected fatal(cause) once and the returned value is unspecified; callers return and check halted() (HUD checks phase() == FATAL); is_tower(id) -> bool and level_count(def_id) -> int are non-fatal"
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
    revised: ""
  - contract: read_context
    status: active
    pattern: direct_call
    producer: data-config
    consumers:
      - enemy-wave
      - tower-sim
      - hero-sim
      - hud-logic
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    signal_signature: "ReadContext(def_id: StringName, level: int = 0, entity: Object = null): level 0 means none and tower levels are 1..level_count; live_entity is always a WeakRef (weakref(null) for a preview); TowerSim keeps a separate command context for build and upgrade cost reads and writes a built tower's level only in the commit; one context per caller, reused, never shared, never holding a stat value"
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
    revised: ""
  - contract: flow_fatal_phase
    status: active
    pattern: direct_call
    producer: game-state-stage-flow
    consumers:
      - hud-logic
      - tower-input
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    signal_signature: "Flow.phase() returns FATAL whenever the battle FatalLatch.is_set is true, as a derived read on the same line, not only after a committed transition; ratified by ADR-0006"
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
    revised: ""


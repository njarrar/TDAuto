    revised: "2026-11-03"
    notes: "ADR-0002 Accepted 2026-11-04; binding"
  - contract: validation_error_shape
    status: active
    pattern: shared_resource
    producer: data-config
    consumers:
      - app-root
      - fatal-screen
      - content-test
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    signal_signature: "ValidationError{code: StringName, source: String, record_id: StringName, field: StringName, detail: String}; tests compare the first four, never detail"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0002 Accepted 2026-11-04; binding"
  - contract: input_adapter_to_resolver
    status: active
    pattern: direct_call
    producer: input-adapter

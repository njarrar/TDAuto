# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: battle_wrapper_teardown
    status: active
    api: "process_mode = PROCESS_MODE_DISABLED, view_wiring.disconnect_all(), remove_child(wrapper), wrapper.queue_free(), then battle.unwire(), from AppRoot._process"
    not: "wrapper.free()"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "Acts outside the wrapper call stack; remove_child stops processing and input at once; queue_free deletes at frame end"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0001 is Proposed; binding only once Accepted"
  - purpose: catalogue_storage_format
    status: active
    api: "JSON files in res://assets/data/catalogue/, listed in manifest.json, read with FileAccess.open + get_as_text and parsed by a JSON instance; one schema table per record type"
    not: ".tres/.res Resources, load() or ResourceLoader for catalogue data"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    reason: "A .tres load hides a missing field, an unknown property and a fractional int before any check can see them"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0002 is Proposed; binding only once Accepted"
  - purpose: catalogue_read_only_snapshot
    status: active
    api: "CatalogueSnapshot.take() schema walk into fresh containers, CatalogueSnapshot.diff(); make_read_only() on every record Array and Dictionary"
    not: "duplicate() or duplicate_deep() for the snapshot"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    reason: "Records are RefCounted, so duplicate_deep() (a Resource method) does not apply; duplicate() on nested arrays is shallow"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0002 is Proposed; binding only once Accepted"
  - purpose: display_stretch
    status: active
    api: "viewport 540x960, display/window/stretch/mode canvas_items, aspect keep, scale_mode fractional, portrait; set explicitly in project.godot"
    not: "aspect expand or keep_width (4.7 new-project default is expand); Camera2D in the battle"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "Only keep makes field units equal viewport units with no offset; letterbox absorbs most notch insets"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0003 is Proposed; binding only once Accepted"
  - purpose: pointer_event_source
    status: active
    api: "emulate_touch_from_mouse false, emulate_mouse_from_touch true; drop device == InputEvent.DEVICE_ID_EMULATION; identify source by event class"
    not: "event.device == 0; touch-only family with mouse emulated as touch 0"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "One forwarded press per physical press; Controls still get emulated mouse on phones; spike S2 verifies"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0003 is Proposed; binding only once Accepted"
  - purpose: app_lifecycle_pause
    status: active
    api: "Union of NOTIFICATION_APPLICATION_FOCUS_OUT, NOTIFICATION_APPLICATION_PAUSED, NOTIFICATION_WM_WINDOW_FOCUS_OUT in InputAdapter._notification, latched per episode"
    not: "SceneTree.paused; resume on focus-in"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    reason: "Which notifications fire per platform is unverified (spike S5); pause is idempotent and resume is by tap only"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-platform-lifecycle.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0003 is Proposed; binding only once Accepted"


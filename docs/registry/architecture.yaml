# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: fatal_handler
    status: active
    pattern: direct_call
    producer: any-sim-builder-accessor
    consumers:
      - fatal-latch
      - app-root
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "fatal(cause: String) -> void, injected as the battle FatalLatch method Callable"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0001 Accepted 2026-11-04; binding"
  - contract: halted_injection
    status: active
    pattern: direct_call
    producer: halt-gate
    consumers:
      - enemy-wave
      - tower-sim
      - hero-sim
      - hud-logic
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "HaltGate.halted() -> bool, injected as a method Callable; never Battle.halted"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0001 Accepted 2026-11-04; binding"
  - contract: battle_wiring
    status: active
    pattern: signal
    producer: battle-builder
    consumers:
      - battle
      - battle-wrapper
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "Wiring.connect_recorded(sig: Signal, target: Callable) for every sim-signal connection, Builder record and wrapper view_wiring; both undone at teardown (view_wiring.disconnect_all(), Battle.unwire())"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-03
    revised: ""
    notes: "ADR-0001 Accepted 2026-11-04; binding"
  - contract: catalogue_load
    status: active
    pattern: direct_call
    producer: data-config
    consumers:

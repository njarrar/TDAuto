# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: battle_teardown
    status: active
    api: "remove_child() then free() on the wrapper, from AppRoot._process only"
    not: "queue_free() on the wrapper or anything holding a Battle"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "queue_free() keeps the node and the old Battle alive to the frame's end (4.7.2 probe); the Retry row needs a null weakref in the same frame"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
    revised: ""
  - purpose: defect_reporting
    status: active
    api: "injected DevErrorSink.report() (default push_error) for recoverable defects; injected fatal() for unrecoverable ones"
    not: "assert()"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "assert does not survive a release build and cannot be replaced by a recording fake (TR-data-009)"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
    revised: ""
  - purpose: scene_loading_from_app_root
    status: active
    api: "preload only the script-free fatal_screen.tscn; load() the wrapper and stage scenes at runtime with a null check into fatal()"
    not: "preload of battle_wrapper.tscn or a stage scene on AppRoot"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "a missing file under a preloaded scene fails AppRoot's own script and the fatal screen never appears; a broken script in a preloaded scene gives a script-less instance (4.7.2 probe)"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
    revised: ""
  - purpose: catalogue_storage_format
    status: active
    api: "JSON files under assets/data/ listed in assets/data/manifest.json, parsed and checked by CatalogueValidator, built into typed RefCounted records"
    not: "typed Resource (.tres) records as the source of truth, or any directory scan"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    reason: "The validator must see raw keys and raw numbers to detect a missing field, a fractional integer and an unknown property (TR-data-002); a .tres with 1.5 in an int export loads as 1, a missing field as its default and an unknown property is dropped, with no error (4.7.2 probe, 2026-11-05)"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
    revised: ""
  - purpose: json_parse
    status: active
    api: "JSON.new().parse(text) with get_error_line(), get_error_message() and get_data()"
    not: "JSON.parse_string"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    reason: "parse_string returns null for a failure, an empty text and a literal null alike, reports no line or message and prints an ERROR with a backtrace on every failure (4.7.2 probe, 2026-11-05)"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
    revised: ""
  - purpose: record_id_type
    status: active
    api: "StringName for def_id and every reference field, lookup parameter and (inherited by ADR-0006) signal payload ID"
    not: "String or int IDs in code"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    reason: "One ID type end to end avoids String/StringName key mismatches; raw strings are converted once in CatalogueBuilder"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
    revised: ""
  - purpose: catalogue_snapshot
    status: active
    api: "hand-rolled to_dict() on each record, Catalogue.snapshot() -> Dictionary and a field-path diff"
    not: "duplicate_deep() on RefCounted records"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    reason: "duplicate_deep() is documented only for Resource trees; the diff must name the changed field (GDD criterion 11)"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
    revised: ""
  - purpose: input_callback_split
    status: active
    api: "InputAdapter reads presses in _unhandled_input and moves, releases and cancels of pointers it forwarded in _input"
    not: "reading moves or releases in _unhandled_input, or presses in _input"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    reason: "a STOP Control appearing over a live gesture swallows its moves in _unhandled_input (4.7.2 spike); presses in _unhandled_input keep a modal from leaking a tap beneath"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    added: 2026-11-05
    revised: ""
  - purpose: pointer_event_family
    status: active
    api: "emulate_touch_from_mouse=true, emulate_mouse_from_touch=false; InputAdapter.read_pointer (static, also called by HudModals) reads only InputEventScreenTouch and InputEventScreenDrag"
    not: "reading InputEventMouse* or branching on InputEvent.device"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    reason: "one event family so a press never arrives twice; desktop exercises the touch path (spike: mouse yields a device -1 touch before the device 32 mouse event)"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    added: 2026-11-05
    revised: ""
  - purpose: display_stretch
    status: active
    api: "viewport 540x960, stretch mode canvas_items, aspect keep, no Camera2D; one DisplayContract.accepts for press bounds; event positions are field units unchanged"
    not: "stretch aspect expand (4.7 new-project default), a Camera2D, or a canvas-transform change on the wrapper"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    reason: "keep makes field units equal viewport units on every device (TR-input-016); the only mode measured by the spike"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    added: 2026-11-05
    revised: ""
  - purpose: hud_control_parenting
    status: active
    api: "every battle HUD Control under one CanvasLayer that is a child of the wrapper; only HudModals is MOUSE_FILTER_STOP, all others MOUSE_FILTER_IGNORE"
    not: "a Control under a Node2D, or a STOP or PASS Control over the field"
    adr: docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    reason: "a Control parented to a Node2D gets a zero-size rect and no GUI input (spike); a stray STOP Control swallows presses before the adapter"
    referenced_by:
      - docs/architecture/adr-0003-input-adapter-display-stretch-and-platform-lifecycle.md
    added: 2026-11-05
    revised: ""
  - purpose: stat_read_failure
    status: active
    api: "injected fatal Callable (method Callable on the battle FatalLatch) called once per bad accessor call with a cause naming call, def_id, key, level and fault code"
    not: "assert(), a sentinel return the caller must test, or a result object"
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    reason: "assert does not survive release (ADR-0001 Decision 8); a result object allocates on every read; GDD Rule 10 makes the handler the contract"
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
    revised: ""
  - purpose: stat_value_read
    status: active
    api: "StatAccessor.stat_int / stat_float with an explicit per-kind match on StatKeys constants"
    not: "reading stat fields off a record directly, Object.get() reflection, or string-literal keys at call sites"
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    reason: "The accessor is the seam the Vertical Slice resolver replaces with no call-site change (TR-data-008)"
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
    revised: ""


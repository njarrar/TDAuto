# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: assert_for_runtime_checks
    status: active
    description: "Catalogue data and accessor calls must never be checked with assert; use if and the injected failure handler"
    why: "The pinned reference does not say a release export keeps assert, and Data GDD Rule 10 needs the check in release"
    adr: docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    added: 2026-11-02
  - pattern: catalogue_global_access
    status: active
    description: "No system reaches the catalogue or the stat accessor through an autoload or a global; both are injected by the battle builder"
    why: "Data GDD Rule 12 and the architecture's no-autoload rule; tests build fixture catalogues in code"
    adr: docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    added: 2026-11-02
  - pattern: mutable_catalogue_records
    status: active
    description: "Catalogue records are never Dictionaries and are never assigned to; collections leave a record only as a duplicate"
    why: "Read-only after load (TR-data-005, GF9)"
    adr: docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    added: 2026-11-02
  - pattern: data_directory_scan
    status: active
    description: "Data files load only from the explicit manifest, never by scanning a directory"
    why: "Data GDD Rule 4: exported builds rename and package files"
    adr: docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    added: 2026-11-02
  - pattern: event_bus_autoload
    status: active
    description: "No global signal hub or event-bus autoload; signals are declared on their owner and connected in BattleBuilder.build or BattleWrapper"
    why: "Hidden global; breaks headless fixtures and the derived wiring test"
    adr: docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    added: 2026-11-02
  - pattern: string_signal_connect
    status: active
    description: "No connect(\"name\", ...) by string; use emitter.signal.connect(bound_method) on statically typed references"
    why: "Deprecated since 4.0; the parser cannot catch a misspelt name"
    adr: docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    added: 2026-11-02
  - pattern: listener_order_dependence
    status: active
    description: "No result may depend on which of two listeners of one signal runs first; a sim signal has at most one sim listener"
    why: "Listener order is NOT SOURCEABLE from the pinned reference (ADR-0002 S1)"
    adr: docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    added: 2026-11-02
  - pattern: deferred_or_awaited_gameplay_signals
    status: active
    description: "Gameplay signals are synchronous: no CONNECT_DEFERRED, no CONNECT_ONE_SHOT, no await on a signal in gameplay code"
    why: "Tick order and determinism (Flow Rule 4, ADR-0003)"
    adr: docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    added: 2026-11-02
  - pattern: system_holds_battle
    status: active
    description: "No battle system holds a reference to Battle; halted() reaches systems through the shared HaltLatch"
    why: "A RefCounted cycle would keep the old battle alive after Retry"
    adr: docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    added: 2026-11-02
  - pattern: direct_sim_command_from_input
    status: active
    description: "Input handlers, views and bots never call a sim command directly; they build a BattleCommand and call Battle.enqueue"
    why: "Determinism must not depend on unverified engine event order (GF7)"
    adr: docs/architecture/adr-0003-frame-order-command-queue-ticks-and-view-update.md
    added: 2026-11-02
  - pattern: real_delta_tick
    status: active
    description: "battle.tick is only called with Battle.DT; no code passes a frame delta to the simulation"
    why: "Fixed-step determinism and identical replays (Flow Rules 4, 5)"
    adr: docs/architecture/adr-0003-frame-order-command-queue-ticks-and-view-update.md
    added: 2026-11-02
  - pattern: engine_time_outside_driver
    status: active
    description: "No sim object, input piece or HUD logic uses _process or reads engine time; real time for the chip comes from the injected RealClock"
    why: "One frame driver; testable with a fake clock"
    adr: docs/architecture/adr-0003-frame-order-command-queue-ticks-and-view-update.md
    added: 2026-11-02
  - pattern: callbacks_in_command_log
    status: active
    description: "The command log holds only plain CommandRecord values, never a command object or a Callable"
    why: "A stored callback points back at a view or input piece and breaks replays and Retry teardown"
    adr: docs/architecture/adr-0003-frame-order-command-queue-ticks-and-view-update.md
    added: 2026-11-02
  - pattern: snapshot_equality
    status: active
    description: "No snapshot comparison with ==; use SnapshotTool.diff"
    why: "Dictionary order and float typing make == unreliable"
    adr: docs/architecture/adr-0004-headless-battle-harness-and-snapshot.md
    added: 2026-11-02
  - pattern: snapshot_in_gameplay
    status: active
    description: "Gameplay code never calls snapshot() or reads the command log"
    why: "Test and replay tooling only"
    adr: docs/architecture/adr-0004-headless-battle-harness-and-snapshot.md
    added: 2026-11-02
  - pattern: remove_while_iterating_roster
    status: active
    description: "Leak and reap never remove from the roster while iterating it; collect, then rebuild"
    why: "Skips neighbours and breaks determinism"
    adr: docs/architecture/adr-0005-simulation-state-attachment-health-status-roster.md
    added: 2026-11-02
  - pattern: enemy_reference_members
    status: active
    description: "No class member of type EnemyInstance or Array[EnemyInstance] outside WaveSim and Combat"
    why: "No system holds a target between attacks"
    adr: docs/architecture/adr-0005-simulation-state-attachment-health-status-roster.md
    added: 2026-11-02
  - pattern: raw_screen_position
    status: active
    description: "No code outside FieldSpace reads an event position or the viewport size for gameplay"
    why: "One coordinate space per gesture"
    adr: docs/architecture/adr-0006-stretch-mode-coordinate-space-safe-area-hud-layering.md
    added: 2026-11-02
  - pattern: per_enemy_nodes
    status: active
    description: "Enemy and effect views never create or free nodes per enemy or effect during a battle"
    why: "Pooled records drawn in one _draw"
    adr: docs/architecture/adr-0006-stretch-mode-coordinate-space-safe-area-hud-layering.md
    added: 2026-11-02
  - pattern: device_zero_check
    status: active
    description: "Never tell mouse from touch by device == 0; use the event class"
    why: "Changed in 4.7 (deprecated-apis.md)"
    adr: docs/architecture/adr-0007-input-adapter-and-gesture-path.md
    added: 2026-11-02
  - pattern: input_handled_in_input
    status: active
    description: "No node calls set_input_as_handled() in _input"
    why: "It would hide events from the adapter"
    adr: docs/architecture/adr-0007-input-adapter-and-gesture-path.md
    added: 2026-11-02
  - pattern: second_lifecycle_owner
    status: active
    description: "Only the BattleWrapper owns lifecycle states; nothing else maps OS notifications"
    why: "One owner (GF6)"
    adr: docs/architecture/adr-0008-app-lifecycle-and-battle-composition.md
    added: 2026-11-02
  - pattern: tree_pause_gameplay
    status: active
    description: "get_tree().paused is never used for gameplay pause"
    why: "Pause is a StageFlow state (ADR-0008)"
    adr: docs/architecture/adr-0008-app-lifecycle-and-battle-composition.md
    added: 2026-11-02
  - pattern: fatal_screen_loads_files
    status: active
    description: "The fatal screen is built in code and loads no file"
    why: "It must show when data or scenes are broken"
    adr: docs/architecture/adr-0008-app-lifecycle-and-battle-composition.md
    added: 2026-11-02
  - pattern: src_depends_on_tests
    status: active
    description: "No code outside tests/ imports or preloads anything under res://tests/ (the harness lives in tests/support/)"
    why: "Shipping code must not depend on test tooling"
    adr: docs/architecture/adr-0004-headless-battle-harness-and-snapshot.md
    added: 2026-11-03


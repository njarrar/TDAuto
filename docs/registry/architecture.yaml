# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: session_catalogue
    status: active
    owner_system: app-root
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    interface: "AppRoot holds the Ready Catalogue for the session and passes it to BattleBuilder.build(); no global, no reload; a retry reuses the same object"
    write_access: app-root-only
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
    revised: ""
  - state: battle_helpers
    status: active
    owner_system: battle
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    interface: "Battle holds every helper build() creates in a strong typed field (each sim, FatalLatch, one StatAccessor, DevErrorSink); reads left_handed, hero_id, burst_id, dt, to_ticks(), in_build(), halted(), is_over(); no helper holds Battle back"
    write_access: battle-only
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
    revised: ""
  - state: catalogue_records
    status: active
    owner_system: data-config
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    interface: "Typed RefCounted records held by Catalogue after a READY load; read through Catalogue lookups (stage, tower, enemy, wave, hero, burst, input, ids; is_tower and level_count are data-level primitives, the caller-facing surface and failure handling are ADR-0005's) that return the live record and null for an unknown ID; fields assigned only by CatalogueBuilder, arrays made read-only"
    write_access: catalogue-builder-only
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-and-validation.md
    added: 2026-11-05
    revised: ""
  - state: stat_key_vocabulary
    status: active
    owner_system: data-config
    adr: docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    interface: "StatKeys (src/data/stat_keys.gd; StatAccessor lives in src/battle/stat_accessor.gd, ReadContext in src/data/read_context.gd) is the only place a stat-key name and its int/float type is written; types mirror ADR-0002's schema and are tied to it by a two-way unit test"
    write_access: data-config-only
    referenced_by:
      - docs/architecture/adr-0005-stat-accessor-and-read-context-contract.md
    added: 2026-11-05
    revised: ""
  - state: enemy_roster
    status: active
    owner_system: enemy-wave
    adr: docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    interface: "EnemyWave solely owns the live Enemy objects (_live: Array[Enemy], spawn_id order); others read roster() and targets() (reused Array[Targetable] buffers valid for one slot); an enemy leaves the roster only by the leak step or the reap; spawn_id starts at 1 and is never reused in a battle"
    write_access: enemy-wave-only
    referenced_by:
      - docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    added: 2026-11-05
    revised: ""
  - state: damage_by_source_counters
    status: active
    owner_system: combat
    adr: docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    interface: "Combat adds the applied amount per source_id and per SourceKind inside deliver; read through dealt_by_id, dealt_by_kind, dealt_total and hero_share; never reset; Flow copies them into the stage result (ADR-0006)"
    write_access: combat-only
    referenced_by:
      - docs/architecture/adr-0009-enemy-entity-roster-and-combat-api.md
    added: 2026-11-05
    revised: ""


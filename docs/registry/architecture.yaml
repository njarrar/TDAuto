# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: Mobile
    adr: docs/architecture/adr-0003-frame-order-command-queue-ticks-and-view-update.md
    added: 2026-11-02
    revised: ""
  - system: battle_tick
    status: active
    budget_ms: 10.0
    adr: docs/architecture/adr-0003-frame-order-command-queue-ticks-and-view-update.md
    notes: "Proposed: 2 ms per tick on the target phone, at most 5 catch-up ticks per frame; measured by the phone spike (GF5)"
    referenced_by:
      - docs/architecture/adr-0003-frame-order-command-queue-ticks-and-view-update.md
    added: 2026-11-02
    revised: ""


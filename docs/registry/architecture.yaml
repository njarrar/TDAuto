#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: injected_and_connected_callables
    status: active
    api: "obj.method and emitter.signal_name.connect(listener.method)"
    not: "Callable(obj, name) string form, connect(name, ...) string form, lambdas, bind()"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "Parser-checked wiring; lambdas and bind() can hold strong references and make RefCounted cycles"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - purpose: release_relevant_checks
    status: active
    api: "injected fatal or dev_error plus push_error"
    not: "assert, print_debug"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "assert and print_debug are stripped from export builds"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - purpose: app_root_scene_loading
    status: active
    api: "ResourceLoader.load() with a null check, then instantiate()"
    not: "preload in app_root.gd"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "A failed preload fails the script that holds the fatal fallback"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - purpose: retry_node_teardown
    status: active
    api: "detach() then remove_child() then queue_free()"
    not: "free() on a node in the current input or signal call"
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    reason: "The retry request starts inside the wrapper's own signal chain"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-04
    revised: ""
  - purpose: catalogue_storage_format
    status: active
    api: "JSON files under res://assets/data/ listed in manifest.json, read with FileAccess.get_file_as_string and JSON.parse"
    not: "typed Resources (.tres), ResourceLoader or load() for data files, ConfigFile, directory scans"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    reason: "Missing fields, fractional integers and unknown properties are direct dictionary checks"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
    revised: ""
  - purpose: catalogue_read_only_proof
    status: active
    api: "Catalogue.snapshot(): JSON.stringify of every record's to_dict() with sorted keys and full precision"
    not: "duplicate_deep() or deep == on nested containers"
    adr: docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    reason: "String compare of JSON-native data does not rely on unsourced container equality"
    referenced_by:
      - docs/architecture/adr-0002-catalogue-storage-format-manifest-validation.md
    added: 2026-11-04
    revised: ""


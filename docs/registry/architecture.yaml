    signal_signature: "Catalogue.load_manifest(manifest_path: String, data_root: String = DATA_ROOT) -> LoadResult reads bytes only; from_texts(manifest_text, file_texts: Dictionary, data_root) runs Tier 0a with no I/O; from_documents(docs: Array[Dictionary]) runs Tier 0b to 4; LoadResult{ok, errors: Array[ValidationError], catalogue}"
    referenced_by:

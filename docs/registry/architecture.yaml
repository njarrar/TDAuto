# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: battle_construction
    status: active
    pattern: direct_call
    producer: battle-builder
    consumers:
      - app-root
      - test-harness
      - bots
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "BattleBuilder.build(catalogue: Catalogue, stage_id: StringName, rng_seed: int, fatal_handler: Callable) -> Battle (null if a fatal fired during build)"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
      - docs/architecture/adr-0004-fixed-tick-clock-tick-order-determinism.md
    added: 2026-11-04
    revised: ""
  - contract: fatal_reporting
    status: active
    pattern: direct_call
    producer: all-battle-systems
    consumers:
      - fatal-relay
      - app-root
      - flow
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    signal_signature: "fatal(cause: String) -> void, injected; idempotent, first cause kept; caller checks halted() and returns"
    referenced_by:
      - docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md

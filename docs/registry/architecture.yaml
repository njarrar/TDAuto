# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_singleton
    status: active
    description: "project.godot has no [autoload] section; no script reaches state through /root/<Name>. The catalogue and the battle are passed down from AppRoot."
    why: "Global state survives a retry and cannot be built headless (TR-data-011, TR-state-001)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: capturing_callable_injection
    status: active
    description: "No lambda, bind() or bindv() result as an injected callable or signal target; method Callables only, on a target held by Battle, BattleWrapper or AppRoot. Bans every lambda under src/battle/."
    why: "bind() holds its bound RefCounted arguments and a capturing lambda holds its captures, so the old battle survives a retry (4.7.2 probe)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: refcounted_back_reference
    status: active
    description: "No object Battle holds stores a reference to Battle or to an object that holds it; no two sims hold each other. Reads go through method Callables such as battle.halted."
    why: "A RefCounted cycle is never released and the weakref test sees only the objects it names (4.7.2 probe)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: static_var_in_gameplay
    status: active
    description: "No static var under src/battle/."
    why: "A static var persists across instances and so outlives a retry (4.7.2 probe)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: node_in_gameplay_class
    status: active
    description: "Classes under src/battle/ extend RefCounted, never Node, and never reference Engine, Time, OS, SceneTree, a Timer or await."
    why: "The battle must build and tick headless with no scene and no engine clock (TR-state-002)."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05
  - pattern: wrapper_references_app_root
    status: active
    description: "Nothing under src/presentation/ or in the wrapper names AppRoot as a type; the wrapper receives AppRoot.request_retry as a Callable."
    why: "A reference back to AppRoot is a preload cycle and couples the fatal path to presentation scripts."
    adr: docs/architecture/adr-0001-app-lifecycle-composition-root-fatal-path.md
    added: 2026-11-05


  - purpose: dev_log_file_write
    status: active
    api: "FileAccess in JsonlFileSink only (besides the catalogue): open READ_WRITE plus seek_end() if the file exists, else WRITE; store_line() (returns bool since 4.4) then flush() per line; one JSON object per line from JSON.stringify (sorted keys) with non-finite floats replaced by null first, nested Arrays and Dictionaries included; a flushed line survives a process kill; launch_id = unix time plus Crypto.generate_random_bytes(4).hex_encode(), made once per launch by AppRoot; build = application/config/version, else Engine.get_version_info().string"
    not: "ignoring the store_* bool; buffered writes flushed per frame; JSON.stringify of NAN or INF (engine warning, invalid JSON)"
    adr: docs/architecture/adr-0010-sim-input-split-command-results-dev-telemetry.md
    reason: "Probes T1 to T7 and the godot-specialist's R1 to R9 and K, verified 4.7.2 headless: failed open returns null with no engine message, store_line false on failure, about 2 us a line with flush, INF inside a nested Array still writes 1e99999"
    referenced_by:
      - docs/architecture/adr-0010-sim-input-split-command-results-dev-telemetry.md
    added: 2026-11-05
    revised: "2026-11-05"
    notes: "ADR-0010 Accepted 2026-11-05; binding"
  - purpose: battle_field_drawing
    status: active
    api: "One _draw node per view family under one FieldViews Node2D, tree order is draw order (Backdrop, ExitStrip, RangeRings, Towers, HeroZones, Enemies, Combat, Hero, HudTopBand, HudField); enemies in three passes by size in spawn_id order; Vector2(t.x, t.y) built only at the draw call; queue_redraw only on change; antialiased false"
    not: "a node per enemy, tower or effect; z_index, CanvasLayer or materials between field views"
    adr: docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    reason: "TR-combat-011, TR-enemy-015, TR-tower-015, TR-hud-001; fewest batch breaks; probe R6 shows _draw runs only when queued and runs headless"
    referenced_by:
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-05
    revised: ""
    notes: "ADR-0011 Proposed 2026-11-05; not binding until Accepted"
  - purpose: path_geometry
    status: active
    api: "Geometry2D.offset_polyline(path_points, path_width / 2, JOIN_MITER, END_BUTT) for the edge and path_width / 2 - 2 for the body, baked once at wrapper build, drawn with draw_colored_polygon; triangulate_polygon check, else one dev error and a draw_polyline fallback"
    not: "draw_polyline or Line2D as the main path"
    adr: docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    reason: "Probe R4, verified 4.7.2 headless: exact square 90 degree corners at width 72 and 68; no dependence on the 4.7 line feather change"
    referenced_by:
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-05
    revised: ""
    notes: "ADR-0011 Proposed 2026-11-05; not binding until Accepted"
  - purpose: battle_hud_text
    status: active
    api: "All battle HUD text drawn by HudField's final pass after its primitives, grouped by size (21, 24, 36 units), from cached TextLine objects re-shaped only on change, drawn with TextLine.draw(get_canvas_item(), pos, colour); one font loaded once by the wrapper, ThemeDB.fallback_font until chosen"
    not: "Label nodes in the battle HUD (modal TapScreens may use them)"
    adr: docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    reason: "Holds TR-hud-015's at most 3 text batches whatever the engine does across nodes; probes R3 and R7"
    referenced_by:
      - docs/architecture/adr-0011-battle-field-rendering-draw-call-budget.md
    added: 2026-11-05
    revised: ""
    notes: "ADR-0011 Proposed 2026-11-05; not binding until Accepted"

# Example:
#

# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: catalogue_storage
    status: active
    api: "JSON text files under res://data/catalogue/ listed in manifest.json, read by FileAccess and an instance JSON parser, checked against a code schema table"
    not: "custom Resource .tres files via ResourceLoader"
    adr: docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    reason: "Missing-field detection (TR-data-004) cannot rest on Resource defaults, which the pinned reference does not cover"
    referenced_by:
      - docs/architecture/adr-0001-catalogue-storage-and-stat-accessor.md
    added: 2026-11-02
    revised: ""
  - purpose: wiring_test_signal_set
    status: active
    api: "(get_script() as Script).get_script_signal_list() and get_signal_connection_list(name) over battle.systems() and every wrapper-built object"
    not: "a hand-written list of signals in the test"
    adr: docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    reason: "A derived set covers new signals with no edit; a hand list goes stale"
    referenced_by:
      - docs/architecture/adr-0002-signal-contracts-and-wiring-conventions.md
    added: 2026-11-02
    revised: ""
  - purpose: frame_driver
    status: active
    api: "AppRoot._process calls BattleWrapper.step(delta): lifecycle and command drain, 0 to 5 fixed ticks of Battle.DT (1/60), outcome step, hero disc, views, late outcome, cancel; then AppRoot latches"
    not: "per-node _process order, _physics_process, or tick(delta) with a real frame delta"
    adr: docs/architecture/adr-0003-frame-order-command-queue-ticks-and-view-update.md
    reason: "Node process order and input-versus-process order are NOT SOURCEABLE; one driver fixes the order"
    referenced_by:
      - docs/architecture/adr-0003-frame-order-command-queue-ticks-and-view-update.md
    added: 2026-11-02
    revised: ""
  - purpose: time_conversion
    status: active
    api: "TickConverter(dt), built first by the builder; StageFlow.to_ticks forwards to it"
    not: "per-system float countdowns"
    adr: docs/architecture/adr-0005-simulation-state-attachment-health-status-roster.md
    reason: "One seconds-to-ticks conversion; no reference cycle through StageFlow"
    referenced_by:
      - docs/architecture/adr-0005-simulation-state-attachment-health-status-roster.md
    added: 2026-11-02
    revised: ""
  - purpose: display_stretch
    status: active
    api: "canvas_items with expand at 540x960, bottom-anchored field, opaque curtains; both input emulation keys false"
    not: "keep (letterbox), viewport mode, Camera2D"
    adr: docs/architecture/adr-0006-stretch-mode-coordinate-space-safe-area-hud-layering.md
    reason: "Visible equals targetable on every aspect; no press outside the field"
    referenced_by:
      - docs/architecture/adr-0006-stretch-mode-coordinate-space-safe-area-hud-layering.md
    added: 2026-11-02
    revised: ""
  - purpose: input_path
    status: active
    api: "InputAdapter reads _input into a pure PointerGate, then the five resolver calls"
    not: "_unhandled_input or Control _gui_input"
    adr: docs/architecture/adr-0007-input-adapter-and-gesture-path.md
    reason: "A STOP Control cannot swallow a release, so the one-closer contract holds"
    referenced_by:
      - docs/architecture/adr-0007-input-adapter-and-gesture-path.md
    added: 2026-11-02
    revised: ""
  - purpose: pause_mechanism
    status: active
    api: "Paused is a StageFlow state; the clock stops; resume is a queued ResumeCommand"
    not: "get_tree().paused"
    adr: docs/architecture/adr-0008-app-lifecycle-and-battle-composition.md
    reason: "Tree pause would stop the frame driver and the fatal path"
    referenced_by:
      - docs/architecture/adr-0008-app-lifecycle-and-battle-composition.md
    added: 2026-11-02
    revised: ""

